<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MathQuest - Petualangan Matematika TK & SD</title>
<meta name="theme-color" content="#0EA5E9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MathQuest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230EA5E9'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle'%3E🚀%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#0EA5E9;--sky-d:#0369A1;--sky-l:#E0F2FE;
  --violet:#8B5CF6;--violet-d:#6D28D9;--violet-l:#EDE9FE;
  --emerald:#10B981;--emerald-d:#047857;--emerald-l:#D1FAE5;
  --amber:#F59E0B;--amber-d:#B45309;--amber-l:#FEF3C7;
  --rose:#F43F5E;--rose-d:#BE123C;--rose-l:#FFE4E6;
  --slate:#0F172A;--slate2:#475569;--slate3:#94A3B8;
  --bg:#F8FAFC;--card:#FFFFFF;--line:#E2E8F0;--line2:#CBD5E1;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 6px 14px rgba(15,23,42,.06);
  --shadow-lg:0 4px 8px rgba(15,23,42,.08),0 18px 28px rgba(15,23,42,.10);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Nunito",system-ui,sans-serif;background:var(--bg);color:var(--slate);
  padding-bottom:calc(72px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;letter-spacing:-.01em}
#app{max-width:560px;margin:0 auto;padding:12px 14px 24px;min-height:100vh}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}

/* ===== HEADER ===== */
header{display:flex;align-items:center;gap:12px;padding:6px 4px 12px}
.avatar{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:1.5rem;background:var(--sky-l);border:2px solid var(--card);box-shadow:var(--shadow);flex-shrink:0}
header .info{flex:1;min-width:0}
header .info .nama{font-weight:800;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .info .lvl{font-size:.76rem;color:var(--slate2);font-weight:600}
.gear{width:36px;height:36px;border-radius:11px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:1.1rem;color:var(--slate2)}

/* ===== HERO ===== */
.hero{background:linear-gradient(135deg,#0EA5E9 0%,#6366F1 50%,#8B5CF6 100%);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;right:-30px;top:-30px;width:140px;height:140px;background:rgba(255,255,255,.08);border-radius:50%}
.hero::after{content:'🚀';position:absolute;right:14px;bottom:6px;font-size:4rem;opacity:.18}
.hero .hi{font-size:.84rem;opacity:.85;font-weight:600}
.hero .nm{font-family:"Baloo 2";font-size:1.5rem;font-weight:800;margin:2px 0 12px}
.hero .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;position:relative;z-index:1}
.hero .stats div{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:12px;padding:8px 4px;text-align:center}
.hero .stats span{display:block;font-family:"Baloo 2";font-size:1.4rem;font-weight:800}
.hero .stats small{font-size:.68rem;opacity:.9;font-weight:600}
.hero .xpbar{height:8px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;margin-top:12px;position:relative;z-index:1}
.hero .xpbar i{display:block;height:100%;background:linear-gradient(90deg,#FCD34D,#fff);border-radius:6px;transition:width .6s}
.hero .xptext{font-size:.72rem;margin-top:5px;opacity:.92;font-weight:600}

/* ===== CARD ===== */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h2{font-size:1.1rem;margin-bottom:8px}
.sub{font-size:.76rem;color:var(--slate3);font-weight:600}

/* ===== SECTIONS ===== */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:16px 4px 8px;padding:0}
.sec-h h2{font-size:1.15rem}
.sec-h a{font-size:.8rem;color:var(--sky);font-weight:700;text-decoration:none}

/* ===== LEVEL TRACK ===== */
.track{position:relative;background:linear-gradient(135deg,#0EA5E9,#8B5CF6);border-radius:22px;padding:16px 14px 18px;margin-bottom:14px;color:#fff;overflow:hidden}
.track::after{content:'⭐';position:absolute;left:8px;top:-8px;font-size:3rem;opacity:.1}
.track h2{color:#fff;font-size:1.1rem;margin-bottom:10px;position:relative}
.track-list{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;position:relative}
.track-list::-webkit-scrollbar{display:none}
.tnode{flex-shrink:0;width:62px;text-align:center;position:relative}
.tnode .dot{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:1.5rem;margin:0 auto}
.tnode.done .dot{background:#10B981;border-color:#34D399}
.tnode.cur .dot{background:#FCD34D;border-color:#FBBF24;box-shadow:0 0 0 4px rgba(252,211,77,.3);animation:pulse 1.8s ease-in-out infinite}
.tnode.locked .dot{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.15);opacity:.5}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(252,211,77,.15)}}
.tnode .lbl{font-size:.66rem;font-weight:700;margin-top:5px;line-height:1.1}
.tnode .bar{position:absolute;top:25px;left:50%;width:6px;height:2px;background:rgba(255,255,255,.2)}
.tnode:last-child .bar{display:none}

/* ===== DAILY GOALS ===== */
.goals .goal{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--bg);margin-top:6px}
.goal .ic{font-size:1.4rem;width:34px;text-align:center}
.goal .txt{flex:1;font-size:.86rem;font-weight:700}
.goal .txt small{display:block;color:var(--slate3);font-weight:600}
.goal .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2)}
.goal.done .chk{background:var(--emerald);border-color:var(--emerald);color:#fff;font-weight:800;font-size:.72rem;display:grid;place-items:center}
.goal.done .txt{opacity:.55;text-decoration:line-through}

/* ===== MODE GRID ===== */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border-radius:16px;padding:14px;color:#fff;box-shadow:var(--shadow);min-height:100px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .12s;position:relative;overflow:hidden}
.mode:active{transform:scale(.97)}
.mode .ic{font-size:1.9rem}
.mode .nm{font-family:"Baloo 2";font-weight:800;font-size:.95rem;margin-top:4px;line-height:1.1}
.mode .meta{font-size:.68rem;opacity:.9;font-weight:600;margin-top:1px}
.mode .star{position:absolute;top:6px;right:8px;font-size:.7rem;background:rgba(255,255,255,.2);padding:1px 6px;border-radius:8px;font-weight:700}
.m-jari{background:linear-gradient(135deg,#F59E0B,#F43F5E)}
.m-bil{background:linear-gradient(135deg,#0EA5E9,#3B82F6)}
.m-op{background:linear-gradient(135deg,#10B981,#06B6D4)}
.m-alj{background:linear-gradient(135deg,#8B5CF6,#6366F1)}
.m-pec{background:linear-gradient(135deg,#EC4899,#8B5CF6)}
.m-cer{background:linear-gradient(135deg,#F43F5E,#F59E0B)}

/* ===== GAME GRID ===== */
.game-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game-tile{border-radius:18px;padding:14px;color:#fff;box-shadow:var(--shadow);min-height:110px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .12s}
.game-tile:active{transform:scale(.97)}
.game-tile .ic{font-size:2.2rem}
.game-tile .nm{font-family:"Baloo 2";font-weight:800;font-size:1rem;margin-top:4px;line-height:1.1}
.game-tile .meta{font-size:.7rem;opacity:.92;font-weight:600;margin-top:1px}
.gt-benteng{background:linear-gradient(135deg,#F59E0B,#EA580C)}
.gt-balloon{background:linear-gradient(135deg,#EC4899,#F43F5E)}
.gt-tree{background:linear-gradient(135deg,#84CC16,#10B981)}
.gt-stair{background:linear-gradient(135deg,#0EA5E9,#6366F1)}
.gt-puzzle{background:linear-gradient(135deg,#8B5CF6,#6366F1)}
.gt-jari{background:linear-gradient(135deg,#06B6D4,#10B981)}

/* ===== BUTTONS ===== */
.btn{display:block;width:100%;background:var(--sky);color:#fff;border-radius:14px;font-weight:800;font-size:1rem;padding:13px;box-shadow:0 4px 0 var(--sky-d);transition:transform .08s;font-family:"Baloo 2"}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sky-d)}
.btn.sec{background:var(--card);color:var(--slate);box-shadow:0 4px 0 var(--line2)}
.btn.warna{background:linear-gradient(135deg,#F59E0B,#EF4444);box-shadow:0 4px 0 #B91C1C;color:#fff}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.ghost{padding:7px 12px;border-radius:11px;background:var(--bg);font-weight:700;font-size:.82rem;color:var(--slate)}
.back{display:flex;align-items:center;gap:6px;padding:6px 4px 10px;font-weight:700;color:var(--slate2);font-size:.92rem}
.back:active{transform:scale(.97)}

/* ===== QUIZ ===== */
.q-meta{display:flex;gap:6px;align-items:center;font-size:.74rem;color:var(--slate2);font-weight:600;margin-bottom:6px}
.q-tag{padding:2px 10px;border-radius:10px;background:var(--sky-l);color:var(--sky-d);font-weight:700;font-size:.72rem}
.prog{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--violet));border-radius:5px;transition:width .4s}
.q-text{font-family:"Baloo 2";font-weight:800;font-size:1.4rem;line-height:1.25;margin:6px 0 10px;min-height:34px}
.q-vis{text-align:center;background:var(--bg);border-radius:14px;padding:10px;margin:6px 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.opt{padding:13px 8px;border-radius:13px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:1rem;font-family:"Baloo 2";transition:transform .1s;display:flex;align-items:center;justify-content:center;text-align:center;min-height:52px}
.opt:active{transform:scale(.96)}
.opt.ok{background:var(--emerald);color:#fff;border-color:var(--emerald)}
.opt.no{background:var(--rose);color:#fff;border-color:var(--rose)}
.isi-disp{text-align:center;font-family:"Baloo 2";font-weight:800;font-size:1.6rem;color:var(--sky-d);min-height:42px;background:var(--bg);border-radius:12px;padding:6px;letter-spacing:2px;margin-bottom:8px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.keypad button{padding:13px;border-radius:11px;background:var(--card);border:2px solid var(--line);font-family:"Baloo 2";font-weight:800;font-size:1.2rem;box-shadow:0 3px 0 var(--line)}
.keypad button:active{transform:translateY(3px);box-shadow:none}
.keypad .go{background:var(--sky);color:#fff;border-color:var(--sky);box-shadow:0 3px 0 var(--sky-d)}
#fb{min-height:34px;text-align:center;font-weight:800;font-size:1rem;margin-top:8px;padding:6px;border-radius:10px}
#fb.ok{background:var(--emerald-l);color:var(--emerald-d)}
#fb.no{background:var(--rose-l);color:var(--rose-d)}

/* ===== VISUALIZATIONS ===== */
/* Hands */
.hands{display:flex;justify-content:center;gap:18px;margin:12px 0;align-items:flex-end}
.hand{display:flex;gap:4px;align-items:flex-end;padding:6px 8px 0;background:#FFC68A;border:2px solid var(--slate);border-radius:22px 22px 10px 10px}
.f{width:20px;height:30px;background:#FFA94D;border:2px solid var(--slate);border-radius:11px 11px 5px 5px;transition:height .25s cubic-bezier(.3,1.6,.5,1);cursor:pointer;margin-bottom:-2px}
.f.up{height:72px;background:#FFC68A}
.hands-act{display:flex;justify-content:center;gap:10px;margin-top:6px}

/* Number line */
.nline{position:relative;height:60px;margin:18px 4px;background:var(--bg);border-radius:12px;border:2px solid var(--line)}
.nline .axis{position:absolute;top:30px;left:8px;right:8px;height:3px;background:var(--slate)}
.nline .tick{position:absolute;top:24px;width:2px;height:14px;background:var(--slate2)}
.nline .tlbl{position:absolute;top:42px;font-size:.66rem;color:var(--slate2);font-weight:700;transform:translateX(-50%)}
.nline .hop{position:absolute;top:6px;font-size:1.3rem;transition:left .4s ease-out}
.nline .target{position:absolute;top:-2px;width:30px;height:64px;border:3px dashed var(--rose);border-radius:10px}

/* Balance scale (algebra) */
.scale-wrap{position:relative;height:170px;margin:8px 4px}
.scale-beam{position:absolute;top:62px;left:50%;transform:translateX(-50%);width:80%;max-width:300px;height:8px;background:linear-gradient(90deg,#94A3B8,#475569,#94A3B8);border-radius:4px;transform-origin:center;transition:transform .3s}
.scale-beam.tilt-l{transform:translateX(-50%) rotate(-6deg)}
.scale-beam.tilt-r{transform:translateX(-50%) rotate(6deg)}
.scale-pan{position:absolute;bottom:0;width:38%;max-width:110px;background:#fff;border:2px solid var(--slate);border-radius:0 0 50% 50%/0 0 80% 80%;min-height:54px;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:2px;padding:6px;font-weight:800;font-size:1rem;box-shadow:0 2px 4px rgba(0,0,0,.06)}
.scale-pan.left{left:0}
.scale-pan.right{right:0}
.scale-string{position:absolute;top:62px;width:1px;height:28px;background:var(--slate2)}
.scale-string.l{left:18%}
.scale-string.r{right:18%}
.scale-post{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:6px;height:62px;background:var(--slate2);border-radius:3px}
.scale-base{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:50px;height:8px;background:var(--slate);border-radius:4px}
.scale-block{width:22px;height:22px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.2)}
.scale-block.box{background:linear-gradient(135deg,#FBBF24,#F59E0B);width:26px;height:26px;font-size:1.2rem;display:grid;place-items:center;color:#fff;font-family:"Baloo 2"}
.scale-expr{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--line);border-radius:10px;padding:3px 10px;font-family:"Baloo 2";font-weight:800;font-size:.95rem;white-space:nowrap}

/* Ten-frame */
.tframe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:280px;margin:10px auto;padding:10px;background:var(--bg);border:2px solid var(--line);border-radius:12px}
.tframe div{aspect-ratio:1;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.tframe div.on{background:var(--sky);border-color:var(--sky-d)}

/* Bars */
.bars{display:flex;justify-content:center;gap:6px;margin:10px 0}
.bar-stack{display:flex;flex-direction:column-reverse;gap:3px;align-items:center}
.bar-unit{width:34px;height:8px;background:var(--violet);border-radius:3px}
.bar-unit.a{background:var(--sky)}
.bar-unit.b{background:var(--rose)}
.bar-lbl{font-family:"Baloo 2";font-weight:800;font-size:1.1rem;color:var(--slate)}

/* ===== BENTENG ALJABAR GAME (DragonBox-style) ===== */
.benteng-arena{background:linear-gradient(180deg,#1E293B,#334155);border-radius:18px;padding:14px;margin:8px 0;color:#fff}
.benteng-arena h3{color:#fff;text-align:center;margin-bottom:6px;font-size:1.05rem}
.benteng-eq{display:flex;justify-content:center;align-items:center;gap:6px;margin:10px 0;padding:14px;background:rgba(255,255,255,.05);border-radius:12px;flex-wrap:wrap}
.benteng-side{display:flex;flex-direction:column;align-items:center;gap:4px}
.benteng-side .lbl{font-size:.66rem;opacity:.7;font-weight:600}
.benteng-block{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;font-family:"Baloo 2";font-weight:800;font-size:1.3rem;cursor:pointer;transition:transform .15s;border:2px solid rgba(255,255,255,.3)}
.benteng-block:hover{transform:scale(1.05)}
.benteng-block.num{background:#3B82F6;color:#fff}
.benteng-block.box{background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#fff}
.benteng-block.die{background:#EF4444;color:#fff}
.benteng-block.evil{background:#1E293B;color:#fff;border-color:#475569;cursor:default}
.benteng-block.op{background:rgba(255,255,255,.15);width:34px;height:34px;font-size:1rem}
.benteng-op{font-size:1.4rem;font-weight:800;color:#fff;display:grid;place-items:center;width:34px}
.benteng-bar{width:100%;height:2px;background:rgba(255,255,255,.2);margin:6px 0;position:relative}
.benteng-inv{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px;padding:8px;background:rgba(255,255,255,.05);border-radius:10px;min-height:60px}
.benteng-tray-lbl{font-size:.66rem;text-align:center;opacity:.6;font-weight:600;margin-bottom:4px}
.benteng-msg{text-align:center;font-weight:800;font-size:.95rem;margin-top:8px;min-height:20px;color:#FCD34D}
.benteng-won{text-align:center;font-size:2.4rem;margin:10px 0;animation:bounce .6s}

/* Balloon arena */
.arena{position:relative;height:380px;overflow:hidden;border-radius:16px;background:linear-gradient(180deg,#BAE6FD,#E0F2FE)}
.balloon{position:absolute;bottom:-90px;width:60px;height:74px;border-radius:50% 50% 48% 48%;display:grid;place-items:center;font-family:"Baloo 2";font-weight:800;font-size:1.4rem;color:#fff;cursor:pointer;border:3px solid rgba(255,255,255,.4);box-shadow:0 4px 10px rgba(0,0,0,.15);animation:naik linear forwards}
@keyframes naik{to{transform:translateY(-490px)}}

/* Number tree */
.tree{display:flex;flex-direction:column;align-items:center;margin:14px 0}
.tree-root{background:linear-gradient(135deg,#84CC16,#10B981);color:#fff;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:"Baloo 2";font-weight:800;font-size:1.5rem;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.2);margin-bottom:6px}
.tree-branches{display:flex;gap:20px}
.tree-leaf{display:flex;flex-direction:column;align-items:center}
.tree-line{width:2px;height:14px;background:#84CC16}
.tree-node{background:#fff;border:2px solid var(--line2);width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:"Baloo 2";font-weight:800;font-size:1.2rem;cursor:pointer}
.tree-node.ok{background:var(--emerald);color:#fff;border-color:var(--emerald)}
.tree-node.no{background:var(--rose);color:#fff;border-color:var(--rose);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Stair (tangga bilangan) */
.stair{display:flex;flex-direction:column-reverse;align-items:flex-start;gap:0;margin:14px 4px}
.stair-step{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:8px;font-family:"Baloo 2";font-weight:800;font-size:1rem;color:#fff;margin-top:2px;transition:transform .15s}
.stair-step.done{box-shadow:0 0 0 3px rgba(16,185,129,.4)}
.stair-step .chk{margin-left:auto;font-size:1rem}
.stair-hint{font-size:.8rem;color:var(--slate2);margin-top:8px;text-align:center}

/* Puzzle (persamaan) */
.puzzle{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.pcell{aspect-ratio:1.6;border-radius:12px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-family:"Baloo 2";font-weight:800;font-size:1.4rem;cursor:pointer;transition:transform .1s}
.pcell:active{transform:scale(.96)}
.pcell.sel{background:var(--sky);color:#fff;border-color:var(--sky-d)}
.pcell.empty{background:var(--bg);border:2px dashed var(--line2)}
.puzzle-q{text-align:center;font-family:"Baloo 2";font-weight:800;font-size:1.2rem;margin:10px 0}
.puzzle-pool{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.pchip{padding:8px 14px;border-radius:11px;background:var(--card);border:2px solid var(--line);font-family:"Baloo 2";font-weight:800;font-size:1rem;cursor:pointer}
.pchip.used{opacity:.3}
.pchip.sel{background:var(--sky);color:#fff;border-color:var(--sky-d)}

/* HUD */

@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}}
.pop{position:fixed;top:-40px;font-size:1.8rem;pointer-events:none;animation:jatuh 1.5s ease-in forwards;z-index:90}
@keyframes jatuh{to{transform:translateY(110vh) rotate(360deg)}}
.combo{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);font-family:"Baloo 2";font-size:2.2rem;font-weight:800;color:var(--amber);pointer-events:none;z-index:50;text-shadow:0 3px 0 rgba(0,0,0,.2);animation:pc .9s ease-out forwards}
@keyframes pc{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}30%{transform:translate(-50%,-50%) scale(1.3);opacity:1}100%{transform:translate(-50%,-140%) scale(1);opacity:0}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.skill-radar{width:100%;max-width:280px;margin:0 auto;display:block}
.empty{text-align:center;padding:24px 16px;color:var(--slate3)}
.empty .ic{font-size:2.8rem;display:block;margin-bottom:6px}

.set-row .lbl{font-weight:700}

.toggle{width:46px;height:26px;background:var(--line2);border-radius:26px;position:relative;flex-shrink:0;transition:background .2s}
.toggle.on{background:var(--emerald)}
.toggle i{position:absolute;top:2px;left:2px;width:22px;height:22px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on i{left:22px}
input[type=range]{flex:1;accent-color:var(--sky)}
.lb{width:100%;border-collapse:collapse}
.lb td{padding:8px 4px;border-bottom:1px solid var(--line);font-weight:700}
.sec-banner{padding:14px 16px;border-radius:14px;color:#fff;margin-bottom:10px;background:linear-gradient(135deg,#0EA5E9,#8B5CF6)}
.sec-banner .ic{font-size:2.2rem;float:left;margin-right:12px}
.sec-banner .nm{font-family:"Baloo 2";font-weight:800;font-size:1.3rem}

.topic .body{flex:1;min-width:0}

.topic .body .meta{font-size:.72rem;color:var(--slate3);font-weight:600}

.mastery-row{margin-bottom:8px}
.mastery-row .head{display:flex;justify-content:space-between;font-weight:700;font-size:.82rem;margin-bottom:3px}
.mastery-row .bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.mastery-row .bar i{display:block;height:100%;border-radius:5px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div id="app"></div>
<nav class="bot" id="nav"></nav>
<script>
"use strict";

/* ===================== STATE ===================== */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const acak=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const today=()=>new Date().toISOString().slice(0,10);
let S=null;
try{S=JSON.parse(localStorage.getItem('mathquest')||'null')}catch(e){}
const simpan=()=>{try{localStorage.setItem('mathquest',JSON.stringify(S))}catch(e){}};
const view=h=>{try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}$('#app').innerHTML=h;window.scrollTo(0,0)};

/* ===== LEVEL JENJANG TK + SD ===== */
const JENJANG=[
  {id:0,nm:'TK A',umur:'4-5 thn',icon:'🌱',xp:0,desc:'Mengenal angka 1-5'},
  {id:1,nm:'TK B',umur:'5-6 thn',icon:'🌷',xp:200,desc:'Berhitung jari 1-10'},
  {id:2,nm:'SD 1',umur:'7 thn',icon:'🌟',xp:500,desc:'Penjumlahan & pengurangan dasar'},
  {id:3,nm:'SD 2',umur:'8 thn',icon:'⭐',xp:900,desc:'Penjumlahan tanpa menyimpan'},
  {id:4,nm:'SD 3',umur:'9 thn',icon:'🌠',xp:1400,desc:'Perkalian & aljabar awal'},
  {id:5,nm:'SD 4',umur:'10 thn',icon:'💫',xp:2000,desc:'Perkalian besar & pecahan'},
  {id:6,nm:'SD 5',umur:'11 thn',icon:'🚀',xp:2800,desc:'Aljabar & FPB/KPK'},
  {id:7,nm:'SD 6',umur:'12 thn',icon:'🏆',xp:3800,desc:'Aljabar lanjut & persen'},
];
function jenjang(){let r=JENJANG[0];for(const j of JENJANG)if(S.xp>=j.xp)r=j;return r}
function jenjangIdx(){let r=0;for(let i=0;i<JENJANG.length;i++)if(S.xp>=JENJANG[i].xp)r=i;return r}
function nextJenjang(){const i=jenjangIdx();return i<JENJANG.length-1?JENJANG[i+1]:null}

/* ===== MASTERY (penguasaan konsep) ===== */
const KONSEP=['jari','bilangan','tambah','kurang','kali','bagi','aljabar','pecahan'];
const KONSEP_NM={jari:'Hitung Jari',bilangan:'Bilangan',tambah:'Penjumlahan',kurang:'Pengurangan',kali:'Perkalian',bagi:'Pembagian',aljabar:'Aljabar',pecahan:'Pecahan'};
const KONSEP_COLOR={jari:'#F59E0B',bilangan:'#0EA5E9',tambah:'#10B981',kurang:'#06B6D4',kali:'#8B5CF6',bagi:'#EC4899',aljabar:'#6366F1',pecahan:'#F43F5E'};

/* ===== BADGES ===== */
const BADGES={
  pertama:['🎯','Langkah Awal','Selesaikan 1 pelajaran'],
  jari5:['🖐️','Jari Pintar','10 benar Hitung Jari'],
  tambah10:['➕','Penjumlah Master','20 benar Penjumlahan'],
  kurang10:['➖','Pengurang Jago','20 benar Pengurangan'],
  kali10:['✖️','Perkalian Star','20 benar Perkalian'],
  aljabar5:['🎁','Detektif Kotak','15 benar Aljabar'],
  combo10:['🔥','Combo X10','10 benar beruntun'],
  perfek:['💯','Sempurna','10/10 di pelajaran'],
  benteng:['🏰','Penakluk Benteng','Selesaikan Benteng Aljabar'],
  balon50:['🎈','Raja Balon','Skor balon 50+'],
  kilat20:['⚡','Pikiran Kilat','Skor kilat 20+'],
  pohon:['🌳','Pemangkas Pohon','Selesai Pohon Angka'],
  tangga:['🪜','Pendaki Tangga','Selesai Tangga Bilangan'],
  rajin:['⭐','Rajin','3 hari berturut'],
  naikTk:['🌱','Lulus TK','Naik ke jenjang SD'],
  naikSd:['🎒','Murid SD','Capai SD 3'],
};

/* ===== AUDIO ENGINE (procedural music + SFX) ===== */
const Snd={
  ctx:null,mGain:null,sGain:null,mTimer:null,mStep:0,mOn:false,vol:.5,sfxVol:.85,
  init(){if(this.ctx)return;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();this.mGain=this.ctx.createGain();this.mGain.gain.value=this.vol;this.mGain.connect(this.ctx.destination);this.sGain=this.ctx.createGain();this.sGain.gain.value=this.sfxVol;this.sGain.connect(this.ctx.destination)}catch(e){}},
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
  note(freq,dur,type='triangle',vol=.18,when=0,dest){if(!this.ctx)return;const t=this.ctx.currentTime+when;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(dest||this.sGain);o.start(t);o.stop(t+dur+.05)},
  noise(dur,vol=.2,filter='highpass',freq=1000,dest){if(!this.ctx)return;const t=this.ctx.currentTime;const buf=this.ctx.createBuffer(1,Math.max(1,this.ctx.sampleRate*dur),this.ctx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=this.ctx.createBufferSource();s.buffer=buf;const f=this.ctx.createBiquadFilter();f.type=filter;f.frequency.value=freq;const g=this.ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(dest||this.sGain);s.start(t);s.stop(t+dur)},
  scale:[262,294,330,392,440,523,587,659,784],
  melody:[4,2,4,5,7,5,4,2,0,4,5,7,5,4,2,null,4,5,7,8,7,5,4,2],
  bass:[0,0,3,3,5,5,3,0],
  startMusic(){this.init();this.resume();if(this.mOn)return;this.mOn=true;const beat=320;this.mStep=0;const tick=()=>{if(!this.mOn||!this.ctx)return;const s=this.mStep%16;const ni=this.melody[s];if(ni!=null)this.note(this.scale[ni],.3,'sine',.06,0,this.mGain);if(s%2===0){const b=this.bass[s/2%8];this.note(b?this.scale[b]/2:0,.45,'triangle',.06,0,this.mGain)}if(s%2===1)this.noise(.04,.018,'highpass',2200,this.mGain);this.mStep++};tick();this.mTimer=setInterval(tick,beat)},
  stopMusic(){this.mOn=false;if(this.mTimer){clearInterval(this.mTimer);this.mTimer=null}},
  sfx(t){this.init();this.resume();if(!this.ctx)return;switch(t){case'ok':[660,880,1100].forEach((f,i)=>this.note(f,.18,'triangle',.22,i*.07));break;case'no':[400,300,220].forEach((f,i)=>this.note(f,.22,'sawtooth',.15,i*.10));break;case'tap':this.note(880,.05,'square',.10);break;case'pop':this.noise(.12,.22,'bandpass',800);this.note(1200,.08,'sine',.15);break;case'win':[523,659,784,1047].forEach((f,i)=>this.note(f,.3,'triangle',.22,i*.10));break;case'star':this.note(1568,.1,'sine',.16);this.note(2093,.14,'sine',.12,.08);break;case'whoosh':this.noise(.22,.15,'lowpass',500);break;case'coin':[988,1319].forEach((f,i)=>this.note(f,.1,'square',.16,i*.05));break;case'combo':[659,784,988,1319].forEach((f,i)=>this.note(f,.08,'triangle',.2,i*.04));break;case'level':[523,659,784,1047,1319].forEach((f,i)=>this.note(f,.18,'triangle',.2,i*.09));break;case'lose':[523,440,349,262].forEach((f,i)=>this.note(f,.22,'sawtooth',.16,i*.11));break;case'flip':this.note(700,.04,'square',.10);this.note(1050,.06,'square',.10,.04);break;case'build':this.note(330,.08,'triangle',.15);this.note(440,.12,'triangle',.15,.06);break;case'crash':this.noise(.4,.3,'lowpass',300);break;case'magic':this.note(880,.1,'sine',.18);this.note(1320,.1,'sine',.18,.08);this.note(1760,.2,'sine',.16,.16);break}},
  setVol(v){this.vol=v;if(this.mGain)this.mGain.gain.value=v},
  setSfxVol(v){this.sfxVol=v;if(this.sGain)this.sGain.gain.value=v},
  applyPrefs(){if(S&&S.audio&&S.audio.music)this.startMusic();else this.stopMusic()}
};

/* ===== TTS ===== */
let vId=null,vReady=false;
function loadV(){if(!window.speechSynthesis)return;const vs=speechSynthesis.getVoices();if(vs.length){vId=vs.find(v=>/^(id|ms)/i.test(v.lang.replace('_','-')))||vs[0];vReady=true}}
if(window.speechSynthesis){loadV();speechSynthesis.onvoiceschanged=loadV}
const lisan=t=>t.replace(/\+/g,' tambah ').replace(/[−-]/g,' kurang ').replace(/×/g,' kali ').replace(/÷/g,' dibagi ').replace(/=/g,' sama dengan ').replace(/\?/g,'').replace(/[🍎🍊🍓🍌🌟⭐🎁]/g,'');
function say(t){if(!S||S.suara===false||!window.speechSynthesis)return;try{speechSynthesis.cancel();if(!vReady)loadV();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';if(vId)u.voice=vId;u.rate=.92;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}

/* ===== FEEDBACK ===== */
const PUJI=['Hebat!','Pintar!','Keren!','Mantap!','Tepat!','Luar biasa!','Mengagumkan!','Jenius!'];
const SEMANGAT=['Hampir!','Coba lagi!','Belajar dari kesalahan!','Lemaskan otakmu!'];
function hujan(e='⭐',n=12){for(let i=0;i<n;i++){const d=document.createElement('div');d.className='pop';d.textContent=e;d.style.left=rnd(2,92)+'vw';d.style.animationDelay=(i*.05)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}}
function comboPop(n){const d=document.createElement('div');d.className='combo';d.textContent='Combo '+n+'! 🔥';document.body.appendChild(d);setTimeout(()=>d.remove(),900)}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function beri(k){if(!S.badges.includes(k)){S.badges.push(k);simpan();setTimeout(()=>{hujan('🏅');say('Lencana baru: '+BADGES[k][1])},600)}}
function hariIni(){const t=today();if(S.last!==t){const k=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.last===k?S.streak+1:1;S.last=t;simpan();if(S.streak>=3)beri('rajin')}}
function addMastery(konsep,ok){if(!S.mastery[konsep])S.mastery[konsep]={b:0,s:0};S.mastery[konsep][ok?'b':'s']++;const m=S.mastery[konsep];const pct=m.b/(m.b+m.s)*100;if(pct>=80&&m.b+m.s>=5&&!S.mastered.includes(konsep))S.mastered.push(konsep);simpan()}

/* ===== MIGRATE ===== */
function migrate(){if(!S)return;S.xp=S.xp||0;S.streak=S.streak||0;S.last=S.last||'';S.badges=S.badges||[];S.rekor=S.rekor||{};S.mastery=S.mastery||{};KONSEP.forEach(k=>{if(!S.mastery[k])S.mastery[k]={b:0,s:0}});S.mastered=S.mastered||[];S.audio=S.audio||{music:false,vol:.5,sfxVol:.85};S.suara=S.suara!==false;S.riwayat=S.riwayat||[];S.today=S.today||{};S.salahBank=S.salahBank||[]}
migrate();

/* ===================== MATH ENGINE (generators per konsep) ===================== */
/* returns {t:questionText, a:answer, konsep, vis:optional visualization key, visData, tip, o:optional choices} */
function genSoal(mode,L){
  const J=jenjangIdx();
  if(mode==='jari'){
    if(J<=1){const n=rnd(1,J===0?5:10);const tipe=Math.random()<.5?'tunjuk':'hitung';
      if(tipe==='tunjuk')return{t:`Tunjukkan ${n} dengan jari`,a:n,konsep:'jari',vis:'hands',visData:{count:0,target:n,interactive:true},tip:`Naikkan ${n} jari`};
      const shown=rnd(1,n);return{t:'Berapa jari yang terangkat?',a:shown,konsep:'jari',vis:'hands',visData:{count:shown,target:0,interactive:false},o:pilihan(shown,10),tip:'Hitung jari yang naik'}
    }else{const a=rnd(1,5),b=rnd(1,5);return{t:`Tunjukkan ${a}+${b} dengan jari`,a:a+b,konsep:'jari',vis:'hands',visData:{count:0,target:a+b,interactive:true,startA:a},tip:`Naikkan ${a} jari, lalu ${b} lagi`}}
  }
  if(mode==='bil'){
    if(J<=1){const n=rnd(1,J===0?5:10);return{t:`Berapa jumlah benda ini?`,a:n,konsep:'bilangan',vis:'dots',visData:{count:n},o:pilihan(n,10),tip:'Hitung satu per satu'}}
    if(J<=3){const n=rnd(10,99);return{t:`Berapa angka ini?`,a:n,konsep:'bilangan',vis:'tframe',visData:{tens:Math.floor(n/10),ones:n%10},o:pilihan(n,99),tip:`${Math.floor(n/10)} puluhan + ${n%10} satuan`}}
    const n=rnd(100,9999);return{t:`Tulis angka ini: ${n.toLocaleString('id-ID')}`,a:n,konsep:'bilangan',vis:'numword',visData:{num:n},tip:'Tulis tanpa titik'}
  }
  if(mode==='op'){
    const r=Math.random();
    if(J<=2){const a=rnd(1,9),b=rnd(1,10-a);return{t:`${a} + ${b} = ?`,a:a+b,konsep:'tambah',vis:'dots2',visData:{a,b},o:pilihan(a+b,20),tip:'Hitung semua'}}
    if(J<=3){if(r<.5){const a=rnd(10,40),b=rnd(5,30);return{t:`${a} + ${b} = ?`,a:a+b,konsep:'tambah',o:pilihan(a+b,99),tip:`${a}+${b}, jumlahkan puluhan dulu`}}const a=rnd(11,30),b=rnd(1,a-1);return{t:`${a} − ${b} = ?`,a:a-b,konsep:'kurang',o:pilihan(a-b,30),tip:'Hitung mundur'}}
    if(J<=4){if(r<.4){const a=rnd(2,9),b=rnd(2,9);return{t:`${a} × ${b} = ?`,a:a*b,konsep:'kali',o:pilihan(a*b,99),tip:`${a} ditambah ${a} sebanyak ${b} kali`}}if(r<.7){const a=rnd(20,80),b=rnd(20,80);return{t:`${a} + ${b} = ?`,a:a+b,konsep:'tambah',o:pilihan(a+b,200),tip:'Puluhan dulu'}}const a=rnd(20,50),b=rnd(1,a-1);return{t:`${a} − ${b} = ?`,a:a-b,konsep:'kurang',o:pilihan(a-b,50),tip:'Kurangi puluhan lalu satuan'}}
    if(J<=5){if(r<.5){const a=rnd(11,25),b=rnd(2,9);return{t:`${a} × ${b} = ?`,a:a*b,konsep:'kali',o:pilihan(a*b,300),tip:`Pecah ${a} jadi puluhan+satuan`}}const a=rnd(50,99),b=rnd(11,49);return{t:`${a} + ${b} = ?`,a:a+b,konsep:'tambah',o:pilihan(a+b,200),tip:'Puluhan dulu'}}
    const a=rnd(2,12),b=rnd(2,12);return{t:`${a} × ${b} = ?`,a:a*b,konsep:'kali',o:pilihan(a*b,200),tip:'Hafalkan perkalian'}
  }
  if(mode==='alj'){
    if(J<=2){const a=rnd(1,5),x=rnd(1,5);return{t:`🎁 + ${a} = ${a+x}`,a:x,konsep:'aljabar',vis:'balance',visData:{l:['box',a],r:a+x},o:pilihan(x,10),tip:`${a+x} dikurangi ${a}`}}
    if(J<=4){if(r<.5){const a=rnd(2,9),x=rnd(2,9);return{t:`${a} + 🎁 = ${a+x}`,a:x,konsep:'aljabar',vis:'balance',visData:{l:[a,'box'],r:a+x},o:pilihan(x,20),tip:`${a+x} dikurangi ${a}`}}const x=rnd(5,15),a=rnd(2,x-1);return{t:`🎁 − ${a} = ${x-a}`,a:x,konsep:'aljabar',o:pilihan(x,20),tip:`${x-a}+${a}`}}
    if(J<=5){const r2=Math.random();if(r2<.5){const a=rnd(2,9),x=rnd(2,9);return{t:`${a} × 🎁 = ${a*x}`,a:x,konsep:'aljabar',o:pilihan(x,20),tip:`${a*x} dibagi ${a}`}}const a=rnd(1,9),x=rnd(2,9);return{t:`2 × 🎁 + ${a} = ${2*x+a}`,a:x,konsep:'aljabar',o:pilihan(x,20),tip:`Kurangi ${a}, lalu bagi 2`}}
    const r2=Math.random();if(r2<.4){const a=rnd(2,9),x=rnd(2,9);return{t:`${a} × 🎁 + 5 = ${a*x+5}`,a:x,konsep:'aljabar',o:pilihan(x,20),tip:'Kurangi 5, bagi '+a}}if(r2<.7){const a=rnd(2,12),x=rnd(2,9);return{t:`${a} × 🎁 = ${a*x}`,a:x,konsep:'aljabar',o:pilihan(x,20),tip:`${a*x} dibagi ${a}`}}const a=rnd(3,9),x=rnd(2,9),c=rnd(1,9);return{t:`${a}×🎁+${c}×🎁 = ${(a+c)*x}`,a:x,konsep:'aljabar',o:pilihan(x,30),tip:`Gabungkan: ${a+c}×🎁`}
  }
  if(mode==='pec'){
    if(J<=4){const d=[2,3,4][rnd(0,2)],n=rnd(1,d-1);return{t:`${n}/${d} dari ${d*4} = ?`,a:n*4,konsep:'pecahan',o:pilihan(n*4,30),tip:`1/${d} dari ${d*4} = ${4}`}}
    const d=[2,3,4,5,8][rnd(0,4)],n=rnd(1,d-1);return{t:`${n}/${d} + ${n}/${d} = ?`,a:(2*n)+'/'+d,konsep:'pecahan',o:acak([(2*n)+'/'+d,n+'/'+(2*d),(2*n)+'/'+(2*d),n+'/'+d]),tip:'Penyebut sama, jumlahkan pembilang'}
  }
  if(mode==='cer'){
    const db=[
      ['Andi punya 3 kelereng, Budi memberi 2 lagi. Berapa sekarang?',3+2,'tambah'],
      ['Ibu membeli 10 apel, dimakan 4. Sisa berapa?',10-4,'kurang'],
      ['1 kotak berisi 6 pensil. 4 kotak berisi berapa pensil?',6*4,'kali'],
      ['12 permen dibagi rata untuk 3 anak. Tiap anak dapat berapa?',12/3,'bagi'],
      ['Sari berusia 8 tahun, kakak 5 tahun lebih tua. Berapa usia kakak?',8+5,'tambah'],
      ['Ada 15 bebek, 6 berenang pergi. Sisa berapa?',15-6,'kurang'],
      ['5 anak masing-masing punya 4 permen. Total berapa?',5*4,'kali'],
      ['20 kue dibagi ke 5 piring. Tiap piring berapa?',20/5,'bagi'],
      ['Tono punya 14 mobil mainan, diberi 7 lagi. Total?',14+7,'tambah'],
      ['Tabungan 50 ribu, beli mainan 20 ribu. Sisa?',50-20,'kurang'],
      ['7 hari × 3 minggu = berapa hari?',7*3,'kali'],
      ['40 buah dibagi 8 keranjang. Tiap keranjang?',40/8,'bagi'],
    ];
    const J2=jenjangIdx();const ok=J2<=1?db.filter(d=>d[2]==='tambah'||d[2]==='kurang'):db;
    const w=ok[rnd(0,ok.length-1)];return{t:w[0],a:w[1],konsep:w[2],o:pilihan(w[1],Math.max(20,w[1]+10)),tip:'Baca pelan-pelan, identifikasi operasi'}
  }
  return null;
}
function pilihan(a,maks){const s=new Set([a]);let g=0;while(s.size<4&&g++<60){const v=a+rnd(-5,5);if(v>=0&&v<=maks&&v!==a)s.add(v)}return acak([...s])}

function visJari(data){
  // interactive hands: data.count = currently up count, target = goal
  return `<div class="hands" id="tg">
    ${[0,1].map(h=>`<div class="hand">${[0,1,2,3,4].map(i=>{const idx=h*5+i;const up=data.interactive?idx<data.count:idx<data.count;return `<b class="f${up?' up':''}" data-i="${idx}" ${data.interactive?`onclick="togJari(${idx})"`:''}></b>`}).join('')}</div>`).join('')}
  </div>${data.interactive?`<div class="hands-act"><span class="hud-pill" id="jcnt">👆 ${data.count} jari</span></div>`:''}`;
}
function togJari(idx){
  if(!Q||kunci)return;
  const b=document.querySelector(`.f[data-i="${idx}"]`);if(!b)return;
  b.classList.toggle('up');
  const cnt=document.querySelectorAll('#tg .f.up').length;
  const el=$('#jcnt');if(el)el.textContent='👆 '+cnt+' jari';
  Q._jariCount=cnt;Snd.sfx('tap');
}
function visDots(data){return `<div class="q-vis" style="font-size:2.4rem;letter-spacing:6px">${'🔵'.repeat(data.count)}</div>`}
function visDots2(data){return `<div class="q-vis"><div style="font-size:2rem;letter-spacing:4px">🔵`.repeat(0)+`${'🔵'.repeat(data.a)}</div><div style="font-size:1.5rem;font-weight:800;color:var(--rose);margin:4px 0">+</div><div style="font-size:2rem;letter-spacing:4px">${'🟢'.repeat(data.b)}</div></div>`}
function visTframe(data){
  const cells=Array(20).fill(0).map((_,i)=>i<data.tens*10+(data.ones||0)?'on':'');
  return `<div class="tframe">${cells.map(c=>`<div class="${c}"></div>`).join('')}</div>`
}
function visNumword(data){return `<div class="q-vis" style="font-family:'Baloo 2';font-weight:800;font-size:2rem">${data.num.toLocaleString('id-ID')}</div>`}
function visBalance(data){
  // data: {l:[...], r:number} render balance with box + numbers on left, total on right
  const renderSide=arr=>arr.map(x=>x==='box'?'<span class="scale-block box">?</span>':`<span class="scale-block" style="background:${KONSEP_COLOR.tambah}">${x}</span>`).join('');
  return `<div class="scale-wrap">
    <div class="scale-expr">${data.l.includes('box')?'🎁':'?'} + ${data.l.filter(x=>x!=='box')[0]||0} = ${data.r}</div>
    <div class="scale-string l"></div><div class="scale-string r"></div>
    <div class="scale-beam" id="beam">
      <div class="scale-pan left">${renderSide(data.l)}</div>
      <div class="scale-pan right"><span class="scale-block" style="background:${KONSEP_COLOR.violet};width:auto;padding:0 6px;height:26px">${data.r}</span></div>
    </div>
    <div class="scale-post"></div><div class="scale-base"></div>
  </div>`;
}
function renderVis(q){
  if(!q.vis)return'';
  if(q.vis==='hands')return visJari(q.visData);
  if(q.vis==='dots')return visDots(q.visData);
  if(q.vis==='dots2')return visDots2(q.visData);
  if(q.vis==='tframe')return visTframe(q.visData);
  if(q.vis==='numword')return visNumword(q.visData);
  if(q.vis==='balance')return visBalance(q.visData);
  return'';
}

/* ===================== GAME: BENTENG ALJABAR (DragonBox-style) ===================== */
/* Goal: isolate the box (🎁) by applying operations to both sides. 
   Setup: e.g. box + 3 = 7. Player taps 'evil' (constant on box side) → it gets cancelled by inverse on both sides. */
let BG=null;
function game_benteng(){
  stopAllGames();
  const levels=[
    {l:['box',3],r:7,hint:'Tap angka di sisi kotak untuk menghilangkannya'},
    {l:['box',2],r:8,hint:'Tap angka di sisi kotak'},
    {l:[5,'box'],r:9,hint:'Tap angka di sisi kotak'},
    {l:['box',4],r:10,hint:'Hilangkan 4 dari sisi kotak'},
    {l:[3,'box'],r:8,hint:'Hilangkan 3 dari sisi kotak'},
    {l:['box',2,2],r:9,hint:'Hilangkan kedua angka di sisi kotak'},
    {l:[2,'box',3],r:10,hint:'Hilangkan kedua angka'},
  ];
  BG={idx:0,levels,solved:0};
  bentengRender();
}
function bentengRender(){
  if(!BG||BG.idx>=BG.levels.length)return bentengWon();
  const lv=BG.levels[BG.idx];
  const L=lv.l.slice();BG.L=L.slice();BG.R=lv.r;
  view(`<div class="back" onclick="stopBenteng();beranda()">← Keluar</div>
  <div class="card">
    <div class="q-meta"><span class="q-tag">🏰 Benteng Aljabar</span><span class="q-tag">Level ${BG.idx+1}/${BG.levels.length}</span></div>
    <p class="sub" style="margin-bottom:8px">🎯 Isolasi 🎁 di satu sisi sendirian untuk menang!</p>
    <div class="benteng-arena">
      <h3>⚖️ Seimbangkan Persamaan</h3>
      <div class="benteng-eq">
        <div class="benteng-side">
          <div class="lbl">Sisi Kotak</div>
          <div style="display:flex;gap:4px;align-items:center" id="bleft">
            ${L.map((x,i)=>x==='box'?'<div class="benteng-block box" data-side="l" data-i="'+i+'">?</div>':'<div class="benteng-block num" data-side="l" data-i="'+i+'" onclick="bentengTap(\'l\','+i+')">'+x+'</div>').join('')}
          </div>
        </div>
        <div class="benteng-op">=</div>
        <div class="benteng-side">
          <div class="lbl">Sisi Jawaban</div>
          <div style="display:flex;gap:4px;align-items:center" id="bright"><div class="benteng-block num" data-side="r" style="background:#10B981">${lv.r}</div></div>
        </div>
      </div>
      <div class="benteng-bar"></div>
      <div class="benteng-tray-lbl">👆 Tap angka di sisi kotak untuk menghilangkannya</div>
      <div class="benteng-msg" id="bmsg">${lv.hint}</div>
    </div>
    <button class="ghost" style="margin-top:8px" onclick="bentengReset()">↺ Ulang Level</button>
  </div>`);
  say('Isolasi kotak dengan menekan angka di sisi kotak');
}
function bentengTap(side,i){
  if(!BG)return;
  // remove the constant at index i from left side, also subtract its value from right side
  const val=BG.L[i];if(val==='box')return;
  BG.L.splice(i,1);BG.R-=val;
  Snd.sfx('magic');
  // re-render left
  const bl=$('#bleft');
  bl.innerHTML=BG.L.map((x,j)=>x==='box'?'<div class="benteng-block box" data-side="l" data-i="'+j+'">?</div>':'<div class="benteng-block num" data-side="l" data-i="'+j+'" onclick="bentengTap(\'l\','+j+')">'+x+'</div>').join('');
  const br=$('#bright');br.innerHTML='<div class="benteng-block num" data-side="r" style="background:#10B981">'+BG.R+'</div>';
  // check win: left is only [box] and right equals box value
  if(BG.L.length===1&&BG.L[0]==='box'){
    const boxVal=BG.R;$('#bmsg').textContent='🎉 Kotak = '+boxVal+'! Kamu menang!';
    Snd.sfx('win');hujan('🎉',12);
    setTimeout(()=>{BG.idx++;BG.solved++;if(BG.idx>=BG.levels.length)bentengWon();else bentengRender()},1400);
  }else if(BG.L.length===0){
    $('#bmsg').textContent='💪 Kotak hilang! Coba lagi';Snd.sfx('no');setTimeout(bentengReset,800);
  }else{$('#bmsg').textContent='Sisa: '+BG.L.length+' blok. Teruskan!'}
}
function bentengReset(){if(!BG)return;const lv=BG.levels[BG.idx];BG.L=lv.l.slice();BG.R=lv.r;bentengRender()}
function stopBenteng(){BG=null}
function bentengWon(){
  const xp=80;S.xp+=xp;S.today.xp=(S.today.xp||0)+xp;S.today.game=(S.today.game||0)+1;
  let rek='';if(BG.solved>BG.levels.length-1){S.rekor.benteng=1;rek='Benteng Taklukkan! 🏆'}
  beri('benteng');simpan();Snd.sfx('win');hujan('🏰',20);say('Kau menaklukkan benteng aljabar!');
  view(`<div class="card" style="text-align:center;padding:24px">
    <div style="font-size:3.6rem;margin-bottom:8px">🏰</div>
    <h1 style="font-size:1.5rem;color:var(--sky-d)">Benteng Ditaklukkan!</h1>

/* ===================== GAME: POHON ANGKA (faktorisasi) ===================== */
let TR=null;
function game_tree(){
  stopAllGames();
  const nums=[12,18,20,24,30,36,40,42,48,56,60,72];
  const root=nums[rnd(0,nums.length-1)];
  TR={root,factors:[],done:false,salah:0};
  // cari faktor: bagi berulang dengan 2,3,5,7
  let n=root;const f=[];
  for(const p of [2,3,5,7]){while(n%p===0){f.push(p);n/=p}}
  if(n>1)f.push(n);
  TR.target=f;
  TR.selected=[];
  treeRender();
}
function treeRender(){
  const cur=TR.root/faktorSofar();
  view(`<div class="back" onclick="stopTree();beranda()">← Keluar</div>
  <div class="card">
    <div class="q-meta"><span class="q-tag">🌳 Pohon Angka</span><span class="q-tag">Faktorisasi</span></div>
    <p class="sub" style="margin-bottom:8px">🎯 Bagi ${TR.root} dengan faktor-faktornya sampai jadi 1!</p>
    <div class="tree">
      <div class="tree-root">${cur%1===0?cur:'?'}</div>
      ${TR.factors.length>0?`<div class="tree-branches">${TR.factors.map((f,i)=>`<div class="tree-leaf"><div class="tree-line"></div><div class="tree-node ok">${f}</div></div>`).join('')}</div>`:''}
    </div>
    <p class="sub" style="text-align:center;margin:10px 0">Pilih faktor prima:</p>
    <div class="puzzle-pool">
      ${[2,3,5,7].map(p=>`<button class="pchip" onclick="treePick(${p})">${p}</button>`).join('')}
    </div>
    <div id="trfb" style="min-height:30px;text-align:center;font-weight:800"></div>
  </div>`);
}
function faktorSofar(){return TR?TR.factors.reduce((a,b)=>a*b,1):1}
function treePick(p){
  if(!TR||TR.done)return;
  const cur=TR.root/faktorSofar();
  if(cur%p===0){TR.factors.push(p);Snd.sfx('build');
    if(faktorSofar()===TR.root){TR.done=true;treeWon()}
    else treeRender();
  }else{TR.salah++;Snd.sfx('no');const fb=$('#trfb');if(fb)fb.textContent='💪 Bukan faktor. Coba lagi!';say('Bukan faktor')}
}
function stopTree(){TR=null}
function treeWon(){
  const xpF=40+(TR.salah===0?20:0);S.xp+=xpF;S.today.xp=(S.today.xp||0)+xpF;S.today.game=(S.today.game||0)+1;
  let rek='';if(!S.rekor.tree||xpF>S.rekor.tree){S.rekor.tree=xpF;rek='Rekor baru! 🏆'}
  beri('pohon');simpan();Snd.sfx('win');hujan('🌳',16);say(`Hebat! ${TR.root} = ${TR.factors.join(' × ')}`);
  view(`<div class="card" style="text-align:center;padding:24px">
    <div style="font-size:3.6rem;margin-bottom:8px">🌳</div>
    <h1 style="font-size:1.5rem;color:var(--sky-d)">Pohon Tumbuh Sempurna!</h1>
    <p class="sub" style="margin-top:4px">${TR.root} = ${TR.factors.join(' × ')} · +${xpF} poin</p>
    <p style="margin-top:8px;color:var(--amber);font-weight:800">${rek}</p>
    <div class="row" style="margin-top:18px"><button class="btn sec" onclick="beranda()">🏠 Beranda</button><button class="btn" onclick="game_tree()">🔁 Lagi</button></div>
  </div>`);
  TR=null;
}

/* ===================== GAME: TANGGA BILANGAN (pola/deret) ===================== */
let ST=null;
function game_stair(){
  stopAllGames();
  const J=jenjangIdx();
  // generate arithmetic progression: start, step, length=5
  let start,step;
  if(J<=1){start=rnd(1,5);step=[1,2][rnd(0,1)]}
  else if(J<=3){start=rnd(5,20);step=[2,3,5][rnd(0,2)]}
  else{start=rnd(20,80);step=[3,4,5,10][rnd(0,3)]}
  const seq=[];for(let i=0;i<5;i++)seq.push(start+i*step);
  ST={seq,step,start,i:0,benar:0,hidup:true};
  stairRender();
}
function stairRender(){
  if(!ST||!ST.hidup)return;
  const next=ST.seq[ST.i+1];
  view(`<div class="back" onclick="stopStair();beranda()">← Keluar</div>
  <div class="card">
    <div class="q-meta"><span class="q-tag">🪜 Tangga Bilangan</span><span class="q-tag">Loncat ${ST.i+1}/4</span></div>
    <p class="sub" style="margin-bottom:8px">🎯 Naiki tangga! Setelah ${ST.seq[ST.i]}, berapa berikutnya?</p>
    <div class="stair">
      ${ST.seq.map((v,i)=>{const cls=i<=ST.i?'done':'';const chk=i<ST.i?'✓':i===ST.i?'👆':'';return `<div class="stair-step ${cls}" style="background:linear-gradient(90deg,${KONSEP_COLOR.bilangan},${KONSEP_COLOR.violet});width:${60+i*8}%">${v}<span class="chk">${chk}</span></div>`}).join('')}
      <div class="stair-step" style="background:var(--bg);color:var(--slate);width:90%;border:2px dashed var(--line2)">?<span class="chk">❓</span></div>
    </div>
    <div class="opts">
      ${pilihan(next,next+10).map(o=>`<button class="opt" onclick="jawabStair(${o},this)">${o}</button>`).join('')}
    </div>
    <div id="stfb" style="min-height:30px;text-align:center;font-weight:800"></div>
    <p class="stair-hint">💡 Pola: tiap naik +${ST.step}</p>
  </div>`);
  say(`Setelah ${ST.seq[ST.i]}, berapa berikutnya?`);
}
function jawabStair(v,el){
  if(!ST||!ST.hidup)return;const next=ST.seq[ST.i+1];const ok=v===next;
  if(ok){ST.benar++;Snd.sfx('build');const fb=$('#stfb');if(fb)fb.textContent='🎉 Naik tangga!';ST.i++;
    if(ST.i>=4)stairWon();else setTimeout(stairRender,800);
  }else{Snd.sfx('no');const fb=$('#stfb');if(fb)fb.textContent='💪 Jawabannya '+next;if(el)el.classList.add('no');setTimeout(stairRender,1200)}
}
function stopStair(){if(ST){ST.hidup=false;ST=null}}
function stairWon(){
  if(!ST)return;const xp=50;S.xp+=xp;S.today.xp=(S.today.xp||0)+xp;S.today.game=(S.today.game||0)+1;
  let rek='';if(!S.rekor.stair||xp>S.rekor.stair){S.rekor.stair=xp;rek='Rekor baru! 🏆'}
  beri('tangga');simpan();Snd.sfx('win');hujan('🪜',16);say(`Hebat! Kamu mencapai puncak tangga!`);
  view(`<div class="card" style="text-align:center;padding:24px">
    <div style="font-size:3.6rem;margin-bottom:8px">🪜</div>
    <h1 style="font-size:1.5rem;color:var(--sky-d)">Puncak Tercapai!</h1>
    <p class="sub" style="margin-top:4px">Benar ${ST.benar} · +${xp} poin</p>
    <p style="margin-top:8px;color:var(--amber);font-weight:800">${rek}</p>
    <div class="row" style="margin-top:18px"><button class="btn sec" onclick="beranda()">🏠 Beranda</button><button class="btn" onclick="game_stair()">🔁 Lagi</button></div>
  </div>`);
  ST=null;
}

/* ===================== GAME: PUZZLE PERSAMAAN ===================== */
let PZ=null;
function game_puzzle(){
  stopAllGames();
  // generate: a + b = c with numbers as tiles, shuffle them, player arranges
  const a=rnd(2,9),b=rnd(2,9),c=a+b,op1='+',op2='=';
  const tiles=acak([a,b,c,op1,op2]);
  PZ={a,b,c,tiles,slots:[null,null,null,null,null],selIdx:null,done:false};
  puzzleRender();
}
function puzzleRender(){
  if(!PZ)return;
  const eq=PZ.slots.map(s=>s===null?'_':s).join(' ');
  view(`<div class="back" onclick="stopPuzzle();beranda()">← Keluar</div>
  <div class="card">
    <div class="q-meta"><span class="q-tag">🧩 Puzzle Persamaan</span><span class="q-tag">Susun Ulang</span></div>
    <p class="sub" style="margin-bottom:8px">🎯 Susun ubin menjadi persamaan yang benar!</p>
    <div class="puzzle-q">${eq}</div>
    <div class="puzzle" id="pzslots">
      ${PZ.slots.map((s,i)=>`<div class="pcell ${s===null?'empty':''}" data-slot="${i}" onclick="puzzleSel(${i})">${s===null?'':s}</div>`).join('')}
    </div>
    <p class="sub" style="text-align:center;margin:8px 0">Pilih ubin:</p>
    <div class="puzzle-pool">
      ${PZ.tiles.map((t,i)=>`<button class="pchip ${PZ.slots.includes(t)&&PZ.tiles.filter(x=>x===t).length===PZ.slots.filter(x=>x===t).length?'used':''}" onclick="puzzlePlace(${i})">${t}</button>`).join('')}
    </div>
    <div id="pzfb" style="min-height:30px;text-align:center;font-weight:800"></div>
    <button class="ghost" style="margin-top:8px" onclick="puzzleClear()">↺ Reset Ubin</button>
  </div>`);
}
function puzzleSel(i){if(!PZ||PZ.done)return;if(PZ.slots[i]!==null){PZ.slots[i]=null;Snd.sfx('tap');puzzleRender()}}
function puzzlePlace(i){
  if(!PZ||PZ.done)return;
  const val=PZ.tiles[i];
  // check if already used
  const usedCount=PZ.slots.filter(s=>s===val).length;
  const tileCount=PZ.tiles.filter(t=>t===val).length;
  if(usedCount>=tileCount)return;
  // place in first empty slot
  const emptyIdx=PZ.slots.indexOf(null);if(emptyIdx<0)return;
  PZ.slots[emptyIdx]=val;Snd.sfx('tap');
  if(!PZ.slots.includes(null)){puzzleCheck()}
  puzzleRender();
}
function puzzleClear(){if(!PZ)return;PZ.slots=[null,null,null,null,null];puzzleRender()}
function puzzleCheck(){
  const s=PZ.slots;const eq=`${s[0]}${s[1]}${s[2]}${s[3]}${s[4]}`;
  const correct=`${PZ.a}+${PZ.b}=${PZ.c}`;
  const correctAlt=`${PZ.b}+${PZ.a}=${PZ.c}`;
  if(eq===correct||eq===correctAlt){PZ.done=true;Snd.sfx('win');const fb=$('#pzfb');if(fb)fb.textContent='🎉 Persamaan benar!';hujan('⭐',12);setTimeout(puzzleWon,1200)}
  else{Snd.sfx('no');const fb=$('#pzfb');if(fb)fb.textContent='💪 Belum tepat. Coba lagi!';setTimeout(puzzleClear,1000)}
}
function stopPuzzle(){PZ=null}
function puzzleWon(){
  if(!PZ)return;const xp=60;S.xp+=xp;S.today.xp=(S.today.xp||0)+xp;S.today.game=(S.today.game||0)+1;
  let rek='';if(!S.rekor.puzzle||xp>S.rekor.puzzle){S.rekor.puzzle=xp;rek='Rekor baru! 🏆'}
  simpan();Snd.sfx('win');say('Persamaan terselesaikan!');
  view(`<div class="card" style="text-align:center;padding:24px">
    <div style="font-size:3.6rem;margin-bottom:8px">🧩</div>
    <h1 style="font-size:1.5rem;color:var(--sky-d)">Puzzle Selesai!</h1>
    <p class="sub" style="margin-top:4px">+${xp} poin · ${PZ.a}+${PZ.b}=${PZ.c}</p>
    <p style="margin-top:8px;color:var(--amber);font-weight:800">${rek}</p>
    <div class="row" style="margin-top:18px"><button class="btn sec" onclick="beranda()">🏠 Beranda</button><button class="btn" onclick="game_puzzle()">🔁 Lagi</button></div>
  </div>`);
  PZ=null;
}

/* ===================== GAME: PETUALANGAN JARI (kecepatan hitung jari) ===================== */
let JG=null;
function game_jari(){
  stopAllGames();
  JG={skor:0,nyawa:3,t:30,hidup:true,combo:0};
  view(`<div class="back" onclick="stopJari();beranda()">← Keluar</div>
  <div class="card"><div class="hud"><span class="pill" id="jgs">⭐ 0</span><span class="pill" id="jgn">❤️❤️❤️</span><span class="pill" id="jgt">⏱ 30</span></div>
  <h2 id="jgq" style="font-family:'Baloo 2';font-size:1.3rem;text-align:center;min-height:46px;margin:8px 0"></h2>
  <div class="opts" id="jgo"></div>
  <div id="jgfb" style="min-height:30px;text-align:center;font-weight:800"></div>
  <p class="sub" style="text-align:center;margin-top:6px">Hitung jari secepatnya!</p></div>`);
  say('Petualangan jari! Hitung secepatnya!');
  jariQ();
  JG.tm=setInterval(()=>{if(!JG||!JG.hidup)return;JG.t--;const el=$('#jgt');if(el)el.textContent='⏱ '+JG.t;if(JG.t<=0)akhirJari()},1000);
}
function jariQ(){
  if(!JG||!JG.hidup)return;
  const n=rnd(1,10);
  JG.q={t:'Ada berapa jari yang terangkat?',a:n,vis:'hands',visData:{count:n,target:0,interactive:false},o:pilihan(n,10),konsep:'jari'};
  const jq=$('#jgq');if(jq)jq.textContent=JG.q.t;
  // render hands vis
  const vis=$('#jgq');if(vis){/* separate vis */}
  // inject hands before opts
  const opts=$('#jgo');
  // prepend hands
  const vis2=document.createElement('div');vis2.innerHTML=visJari(JG.q.visData);
  opts.parentNode.insertBefore(vis2,opts);
  opts.innerHTML=JG.q.o.map(o=>`<button class="opt" onclick="jawabJari(${o},this)">${o}</button>`).join('');
  say(JG.q.t);
}
function jawabJari(v,el){
  if(!JG||!JG.hidup)return;const ok=v===JG.q.a;
  if(ok){JG.combo++;JG.skor+=5+(JG.combo>1?2:0);Snd.sfx('ok');if(JG.combo>=3){Snd.sfx('combo');comboPop(JG.combo)}$('#jgs').textContent='⭐ '+JG.skor;const fb=$('#jgfb');if(fb)fb.textContent='✔ +'+(5+(JG.combo>1?2:0))+' poin'}
  else{JG.combo=0;JG.nyawa--;Snd.sfx('no');$('#jgn').textContent='❤️'.repeat(JG.nyawa)||'💔';const fb=$('#jgfb');if(fb)fb.textContent='✖ Jawabannya '+JG.q.a;if(el)el.classList.add('no');if(JG.nyawa<=0)return akhirJari()}
  setTimeout(jariQ,ok?350:800);
}
function stopJari(){if(JG){JG.hidup=false;if(JG.tm)clearInterval(JG.tm)}}
function akhirJari(){
  if(!JG)return;stopJari();const sk=JG.skor,xp=sk*2;S.xp+=xp;S.today.xp=(S.today.xp||0)+xp;S.today.game=(S.today.game||0)+1;
  let rek='';if(sk>(S.rekor.jarigame||0)){S.rekor.jarigame=sk;rek='Rekor baru! 🏆'}
  if(S.mastery.jari)S.mastery.jari.b+=Math.floor(sk/5);simpan();Snd.sfx('lose');hujan('🖐️',12);say(`Skor ${sk}.${rek?' '+rek:''}`);
  view(`<div class="card" style="text-align:center;padding:24px">
    <div style="font-size:3.6rem;margin-bottom:8px">🖐️</div>
    <h1 style="font-size:1.5rem;color:var(--sky-d)">Skor: ${sk}</h1>
    <p class="sub" style="margin-top:4px">+${xp} poin · Rekor: ${S.rekor.jarigame||0}</p>
    <p style="margin-top:8px;color:var(--amber);font-weight:800">${rek}</p>
    <div class="row" style="margin-top:18px"><button class="btn sec" onclick="beranda()">🏠 Beranda</button><button class="btn" onclick="game_jari()">🔁 Lagi</button></div>
  </div>`);
  JG=null;
}

/* ===================== STOP ALL GAMES ===================== */
function stopAllGames(){stopGame();stopBenteng();stopTree();stopStair();stopPuzzle();stopJari()}
function home(){stopAllGames();beranda()}

/* ===================== PROFIL ===================== */
function profil(){
  renderNav('profil');
  const j=jenjang(),ni=jenjangIdx(),nx=nextJenjang();
  const xpInLevel=S.xp-j.xp,xpNext=nx?nx.xp-j.xp:1,xpPct=Math.round(xpInLevel/xpNext*100);
  let totB=0,totS=0;KONSEP.forEach(k=>{totB+=S.mastery[k]?.b||0;totS+=S.mastery[k]?.s||0});
  const akurasi=totB+totS>0?Math.round(totB/(totB+totS)*100):0;
  view(`<div class="back" onclick="beranda()">← Kembali</div>
  <div class="card" style="text-align:center;padding:18px">
    <div style="font-size:3.6rem">${S.av}</div>
    <h1 style="font-size:1.4rem;color:var(--sky-d);margin-top:4px">${S.nama}</h1>
    <p class="sub">${j.icon} ${j.nm} · ${j.umur}</p>
    <div class="prog" style="margin-top:12px"><i style="width:${xpPct}%"></i></div>
    <p class="sub" style="margin-top:5px">${xpInLevel}/${xpNext} poin${nx?` menuju ${nx.nm}`:''}</p>
  </div>

  <div class="card">
    <h2>📊 Statistik Matematika</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div style="background:var(--sky-l);padding:10px;border-radius:11px;text-align:center"><div style="font-family:'Baloo 2';font-size:1.4rem;font-weight:800;color:var(--sky-d)">${totB}</div><div class="sub">Benar</div></div>
      <div style="background:var(--rose-l);padding:10px;border-radius:11px;text-align:center"><div style="font-family:'Baloo 2';font-size:1.4rem;font-weight:800;color:var(--rose-d)">${totS}</div><div class="sub">Salah</div></div>
      <div style="background:var(--emerald-l);padding:10px;border-radius:11px;text-align:center"><div style="font-family:'Baloo 2';font-size:1.4rem;font-weight:800;color:var(--emerald-d)">${akurasi}%</div><div class="sub">Akurasi</div></div>
      <div style="background:var(--amber-l);padding:10px;border-radius:11px;text-align:center"><div style="font-family:'Baloo 2';font-size:1.4rem;font-weight:800;color:var(--amber-d)">${S.streak}🔥</div><div class="sub">Hari Beruntun</div></div>
    </div>
  </div>

  <div class="card">
    <h2>🎓 Penguasaan Konsep</h2>
    ${KONSEP.map(k=>{const m=S.mastery[k]||{b:0,s:0};const tot=m.b+m.s;const pct=tot?Math.round(m.b/tot*100):0;const mastered=S.mastered.includes(k);return `<div class="mastery-row"><div class="head"><span>${mastered?'⭐ ':''}${KONSEP_NM[k]}</span><span class="sub">${m.b}/${tot} · ${pct}%${mastered?' · Mastered':''}</span></div><div class="bar"><i style="width:${pct}%;background:${KONSEP_COLOR[k]}"></i></div></div>`}).join('')}
  </div>

  <div class="card">
    <h2>🏅 Lencana (${S.badges.length}/${Object.keys(BADGES).length})</h2>
    <div class="bdg-grid">${Object.entries(BADGES).map(([k,v])=>`<div class="bdg ${S.badges.includes(k)?'':'off'}"><span class="ic">${v[0]}</span>${v[1]}<br><small style="color:var(--slate3)">${v[2]}</small></div>`).join('')}</div>
  </div>

  <div class="card">
    <h2>🏆 Rekor Game</h2>
    ${[['benteng','🏰','Benteng Aljabar'],['balloon','🎈','Balon Berhitung'],['tree','🌳','Pohon Angka'],['stair','🪜','Tangga Bilangan'],['puzzle','🧩','Puzzle Persamaan'],['jari','🖐️','Petualangan Jari']].map(([k,i,n])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span style="font-weight:700">${i} ${n}</span><span style="font-family:'Baloo 2';font-weight:800;color:var(--sky-d)">${S.rekor[k]||'-'}</span></div>`).join('')}
  </div>

  <button class="btn sec" onclick="pengaturan()">⚙️ Pengaturan</button>
  <button class="btn warna" style="margin-top:8px" onclick="ganti()">🚪 Ganti Pemain</button>
  `);
}

/* ===================== PENGATURAN ===================== */
function pengaturan(){
  view(`<div class="back" onclick="profil()">← Kembali</div>
  <div class="card">
    <h2>⚙️ Pengaturan</h2>
    <div class="set-row"><div class="lbl">🎶 Musik Latar<small>Melodi ceria procedural</small></div><div class="toggle ${S.audio.music?'on':''}" onclick="toggleMusik()"><i></i></div></div>
    <div class="set-row"><span class="lbl">🎵 Volume Musik</span><input type="range" min="0" max="100" value="${Math.round((S.audio.vol||.5)*100)}" oninput="setVolM(this.value)"></div>
    <div class="set-row"><span class="lbl">🔊 Volume Efek</span><input type="range" min="0" max="100" value="${Math.round((S.audio.sfxVol||.85)*100)}" oninput="setVolS(this.value)"></div>
    <div class="set-row"><div class="lbl">🗣️ Suara Bicara<small>Bacakan soal</small></div><div class="toggle ${S.suara!==false?'on':''}" onclick="toggleSuara()"><i></i></div></div>
  </div>
  <button class="btn sec" onclick="profil()">✅ Selesai</button>
  <button class="btn warna" style="margin-top:8px" onclick="if(confirm('Hapus semua data?')){localStorage.removeItem('mathquest');location.reload()}">🗑️ Reset Data</button>
  `);
}
function toggleMusik(){S.audio.music=!S.audio.music;simpan();Snd.applyPrefs();toast(S.audio.music?'🎶 Musik on':'🔇 Musik off');pengaturan()}
function setVolM(v){S.audio.vol=v/100;simpan();Snd.setVol(v/100)}
function setVolS(v){S.audio.sfxVol=v/100;simpan();Snd.setSfxVol(v/100);if(v>0)Snd.sfx('tap')}
function toggleSuara(){S.suara=S.suara===false;simpan();if(S.suara){Snd.resume();say('Suara dinyalakan')}pengaturan()}
function ganti(){if(confirm('Ganti pemain?')){Snd.stopMusic();localStorage.removeItem('mathquest');S=null;masuk()}}

/* ===================== START ===================== */
S?beranda():masuk();
</script>
