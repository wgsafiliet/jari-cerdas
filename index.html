<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Akademia Cerdas - Belajar Multi Mata Pelajaran</title>
<meta name="theme-color" content="#4F46E5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Akademia">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234F46E5'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle'%3E📚%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --indigo:#4F46E5;--indigo-d:#3730A3;--indigo-l:#EEF2FF;
  --amber:#F59E0B;--amber-l:#FEF3C7;
  --emerald:#10B981;--emerald-l:#D1FAE5;
  --rose:#F43F5E;--rose-l:#FFE4E6;
  --sky:#0EA5E9;--sky-l:#E0F2FE;
  --violet:#8B5CF6;--violet-l:#EDE9FE;
  --slate:#1E293B;--slate2:#475569;--slate3:#94A3B8;
  --bg:#F1F5F9;--card:#FFFFFF;--line:#E2E8F0;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 4px 12px rgba(15,23,42,.06);
  --shadow-lg:0 4px 6px rgba(15,23,42,.07),0 16px 24px rgba(15,23,42,.08);
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Nunito",system-ui,sans-serif;background:var(--bg);color:var(--slate);
  padding-bottom:calc(72px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.judul{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;letter-spacing:-.01em}
#app{max-width:560px;margin:0 auto;padding:14px 16px 24px;min-height:100vh}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:8px}

/* ===== HEADER ===== */
header{display:flex;align-items:center;gap:12px;padding:8px 4px 14px}
.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;background:var(--indigo-l);border:2px solid var(--card);box-shadow:var(--shadow);flex-shrink:0}
header .info{flex:1;min-width:0}
header .info .nama{font-weight:800;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .info .lvl{font-size:.78rem;color:var(--slate2);font-weight:600}
.lvl-badge{display:inline-flex;align-items:center;gap:3px;background:var(--amber);color:#fff;padding:1px 8px;border-radius:10px;font-weight:700;font-size:.72rem}
.gear{width:38px;height:38px;border-radius:11px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:1.15rem;color:var(--slate2)}
.gear:active{transform:scale(.94)}

/* ===== CARDS ===== */
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card.h{padding:18px}
.card h2{font-size:1.15rem;margin-bottom:10px}
.sub{font-size:.78rem;color:var(--slate3);font-weight:600}

/* ===== HERO STATS ===== */
.hero{background:linear-gradient(135deg,var(--indigo) 0,var(--violet) 100%);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;right:-30px;top:-30px;width:140px;height:140px;background:rgba(255,255,255,.08);border-radius:50%}
.hero::after{content:'';position:absolute;right:30px;bottom:-50px;width:80px;height:80px;background:rgba(255,255,255,.06);border-radius:50%}
.hero .hi{font-size:.85rem;opacity:.85;font-weight:600}
.hero .nm{font-family:"Baloo 2";font-size:1.6rem;font-weight:800;margin:2px 0 14px}
.hero .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;position:relative;z-index:1}
.hero .stats div{background:rgba(255,255,255,.15);backdrop-filter:blur(6px);border-radius:14px;padding:8px 6px;text-align:center}
.hero .stats span{display:block;font-family:"Baloo 2";font-size:1.5rem;font-weight:800}
.hero .stats small{font-size:.7rem;opacity:.9;font-weight:600}
.hero .xpbar{height:8px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;margin-top:14px;position:relative;z-index:1}
.hero .xpbar i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .6s}
.hero .xptext{font-size:.74rem;margin-top:6px;opacity:.9;font-weight:600}

/* ===== SECTION HEADER ===== */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 10px}
.sec-h h2{font-size:1.2rem}
.sec-h a{font-size:.82rem;color:var(--indigo);font-weight:700;text-decoration:none}

/* ===== SUBJECT GRID ===== */
.subj-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subj{border-radius:16px;padding:14px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow);min-height:96px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .15s}
.subj:active{transform:scale(.97)}
.subj .ic{font-size:2rem;margin-bottom:auto}
.subj .nm{font-family:"Baloo 2";font-weight:800;font-size:1.05rem;line-height:1.1;margin-top:6px}
.subj .prog{font-size:.72rem;opacity:.92;font-weight:600;margin-top:2px}
.subj .bar{height:5px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;margin-top:6px}
.subj .bar i{display:block;height:100%;background:#fff;border-radius:4px}
.subj-mtk{background:linear-gradient(135deg,#6366F1,#8B5CF6)}
.subj-bind{background:linear-gradient(135deg,#F59E0B,#EF4444)}
.subj-ipa{background:linear-gradient(135deg,#10B981,#06B6D4)}
.subj-bing{background:linear-gradient(135deg,#EC4899,#8B5CF6)}

/* ===== CHART ===== */
.chart{height:130px;display:flex;align-items:flex-end;gap:6px;padding:0 4px}
.chart .bar{flex:1;background:linear-gradient(180deg,var(--indigo) 0,var(--violet) 100%);border-radius:6px 6px 0 0;min-height:4px;position:relative;transition:height .4s}
.chart .bar.today{background:linear-gradient(180deg,var(--amber) 0,#EF4444 100%)}
.chart .lbl{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:.66rem;color:var(--slate3);font-weight:600}
.chart-wrap{padding-bottom:22px}

/* ===== STREAK HEATMAP ===== */
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.heatmap div{aspect-ratio:1;border-radius:5px;background:var(--line)}
.heatmap div.l1{background:#C7D2FE}.heatmap div.l2{background:#A5B4FC}
.heatmap div.l3{background:#818CF8}.heatmap div.l4{background:#4F46E5}

/* ===== DAILY MISSIONS ===== */
.misi{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--bg);margin-top:8px}
.misi .ic{font-size:1.6rem;width:38px;text-align:center}
.misi .txt{flex:1;font-size:.86rem;font-weight:600}
.misi .txt small{display:block;color:var(--slate3);font-weight:500}
.misi .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line)}
.misi.done .chk{background:var(--emerald);border-color:var(--emerald);display:grid;place-items:center;color:#fff;font-weight:800;font-size:.8rem}
.misi.done .txt{opacity:.55;text-decoration:line-through}

/* ===== TOPIC LIST ===== */
.topic{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--bg);margin-bottom:8px;transition:transform .12s}
.topic:active{transform:scale(.98)}
.topic .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:1.5rem;flex-shrink:0}
.topic .body{flex:1;min-width:0}
.topic .body .nm{font-weight:700;font-size:.95rem}
.topic .body .meta{font-size:.74rem;color:var(--slate3);font-weight:600}
.topic .arr{color:var(--slate3);font-size:1.2rem}
.topic.locked{opacity:.5}
.topic.locked .arr::before{content:'🔒'}

/* ===== BUTTONS ===== */
.btn{display:block;width:100%;background:var(--indigo);color:#fff;border-radius:14px;font-weight:800;font-size:1.05rem;padding:14px;box-shadow:0 4px 0 var(--indigo-d);transition:transform .08s;font-family:"Baloo 2"}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--indigo-d)}
.btn.sec{background:var(--card);color:var(--slate);box-shadow:0 4px 0 var(--line)}
.btn.warna{background:linear-gradient(135deg,var(--amber),#EF4444);box-shadow:0 4px 0 #B91C1C;color:#fff}
.btn.warna:active{box-shadow:0 1px 0 #B91C1C}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.ghost{padding:8px 14px;border-radius:11px;background:var(--bg);font-weight:700;font-size:.86rem;color:var(--slate)}
.ghost:active{transform:scale(.96)}

/* ===== QUIZ ===== */
.q-pel{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--slate2);font-weight:600;margin-bottom:8px}
.prog{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--indigo),var(--violet));border-radius:5px;transition:width .4s}
.q-meta{display:flex;gap:6px;align-items:center;font-size:.78rem;color:var(--slate2);font-weight:600;margin-bottom:6px}
.q-tag{padding:2px 10px;border-radius:10px;background:var(--indigo-l);color:var(--indigo);font-weight:700}
.q-tag.benar{background:var(--emerald-l);color:var(--emerald)}
.q-text{font-family:"Baloo 2";font-weight:800;font-size:1.5rem;line-height:1.25;margin:8px 0 12px}
.q-vis{font-size:1.7rem;text-align:center;background:var(--bg);border-radius:12px;padding:12px;margin:8px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.opt{padding:14px 8px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:1.1rem;font-family:"Baloo 2";transition:transform .1s;display:flex;align-items:center;justify-content:center;text-align:center;min-height:54px}
.opt:active{transform:scale(.96)}
.opt.ok{background:var(--emerald);color:#fff;border-color:var(--emerald)}
.opt.no{background:var(--rose);color:#fff;border-color:var(--rose)}
.opt.sel{border-color:var(--indigo);background:var(--indigo-l)}
.opts.bs{grid-template-columns:1fr 1fr}
.opts.bs .opt{padding:18px 8px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tf button{padding:18px;border-radius:16px;font-family:"Baloo 2";font-weight:800;font-size:1.3rem;box-shadow:0 4px 0 var(--line)}
.tf .ya{background:var(--emerald-l);color:var(--emerald)}
.tf .tidak{background:var(--rose-l);color:var(--rose)}
.tf .ya.sel{background:var(--emerald);color:#fff}
.tf .tidak.sel{background:var(--rose);color:#fff}
.isian{display:flex;gap:8px;align-items:center}
.isian input{flex:1;font-family:"Baloo 2";font-weight:800;font-size:1.4rem;text-align:center;padding:12px;border:2px solid var(--line);border-radius:14px;background:var(--bg)}
.isian button{padding:12px 18px;background:var(--indigo);color:#fff;border-radius:14px;font-weight:800}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.keypad button{padding:14px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-family:"Baloo 2";font-weight:800;font-size:1.3rem;box-shadow:0 3px 0 var(--line)}
.keypad button:active{transform:translateY(3px);box-shadow:none}
.isi-disp{text-align:center;font-family:"Baloo 2";font-weight:800;font-size:1.8rem;color:var(--indigo);min-height:42px;background:var(--bg);border-radius:12px;padding:6px;letter-spacing:3px}

.cocok{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.cocok button{padding:10px 6px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:.9rem;min-height:48px}
.cocok button.sel{border-color:var(--indigo);background:var(--indigo-l)}
.cocok button.cocok{background:var(--emerald);color:#fff;border-color:var(--emerald)}
.cocok button.salah{background:var(--rose);color:#fff;border-color:var(--rose);opacity:.6}

.urut{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.urut .chip{padding:10px 14px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-weight:700;font-family:"Baloo 2";font-size:1.05rem}
.urut .chip.sel{border-color:var(--indigo);background:var(--indigo-l)}
.urut-target{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:46px;background:var(--bg);border:2px dashed var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.urut-target .chip{background:var(--indigo);color:#fff}

#fb{min-height:38px;text-align:center;font-weight:800;font-size:1.1rem;margin-top:10px;padding:8px;border-radius:10px}
#fb.ok{background:var(--emerald-l);color:var(--emerald)}
#fb.no{background:var(--rose-l);color:var(--rose)}

/* ===== GAME TILES ===== */
.game-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game-tile{border-radius:18px;padding:16px 12px;text-align:left;color:#fff;box-shadow:var(--shadow);min-height:120px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s}
.game-tile:active{transform:scale(.97)}
.game-tile .ic{font-size:2.4rem;margin-bottom:auto}
.game-tile .nm{font-family:"Baloo 2";font-weight:800;font-size:1.05rem;margin-top:6px;line-height:1.1}
.game-tile .meta{font-size:.72rem;opacity:.92;font-weight:600;margin-top:2px}
.gt-menara{background:linear-gradient(135deg,#F59E0B,#EA580C)}
.gt-balon{background:linear-gradient(135deg,#EC4899,#F43F5E)}
.gt-kartu{background:linear-gradient(135deg,#8B5CF6,#6366F1)}
.gt-kilat{background:linear-gradient(135deg,#10B981,#06B6D4)}
.gt-kata{background:linear-gradient(135deg,#0EA5E9,#6366F1)}
.gt-lab{background:linear-gradient(135deg,#84CC16,#10B981)}
.game-tile.wide{grid-column:span 2}

/* ===== GAME ARENAS ===== */
.arena{position:relative;height:420px;overflow:hidden;border-radius:18px;background:linear-gradient(180deg,#BAE6FD,#E0F2FE)}
.balloon{position:absolute;bottom:-90px;width:64px;height:80px;border-radius:50% 50% 48% 48%;display:grid;place-items:center;font-family:"Baloo 2";font-weight:800;font-size:1.6rem;color:#fff;cursor:pointer;border:3px solid rgba(255,255,255,.5);box-shadow:0 4px 12px rgba(0,0,0,.15);animation:naik linear forwards}
@keyframes naik{to{transform:translateY(-540px)}}
.tower{display:flex;flex-direction:column-reverse;align-items:center;gap:4px;height:340px;padding:10px}
.floor{width:80%;max-width:240px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;color:#fff;font-family:"Baloo 2";animation:bgnah .3s}
@keyframes bgnah{from{transform:translateY(-20px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.lab-stage{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:14px 0}
.lab-tube{width:60px;height:90px;background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,.2));border:2px solid var(--line);border-radius:0 0 16px 16px;display:flex;flex-direction:column-reverse;align-items:center;padding-bottom:4px;position:relative}
.lab-tube .fill{width:100%;border-radius:0 0 14px 14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.4rem;font-family:"Baloo 2";text-align:center}
.kata-disp{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0;min-height:50px}
.kata-disp .lt{width:42px;height:48px;border-radius:10px;background:var(--indigo);color:#fff;display:grid;place-items:center;font-family:"Baloo 2";font-weight:800;font-size:1.4rem}
.kata-pool{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.kata-pool .lt{width:42px;height:48px;border-radius:10px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-family:"Baloo 2";font-weight:800;font-size:1.4rem;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.kata-pool .lt:active{transform:translateY(3px);box-shadow:none}

.hud{display:flex;justify-content:space-between;font-weight:800;font-size:1rem;margin-bottom:8px;gap:8px;align-items:center}
.hud .pill{background:var(--bg);padding:6px 12px;border-radius:12px;font-size:.95rem}

/* ===== BOTTOM NAV ===== */
nav.bot{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;z-index:50;max-width:560px;margin:0 auto}
nav.bot button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 12px;color:var(--slate3);font-weight:700;font-size:.7rem;border-radius:12px}
nav.bot button .ic{font-size:1.4rem}
nav.bot button.aktif{color:var(--indigo)}
nav.bot button.aktif .ic{transform:translateY(-2px)}

/* ===== MISC ===== */
.bdg-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.bdg{background:var(--bg);border-radius:14px;padding:12px 8px;text-align:center;font-size:.76rem;font-weight:700}
.bdg .ic{font-size:2rem;display:block;margin-bottom:4px}
.bdg.off{opacity:.4;filter:grayscale(1)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--slate);color:#fff;padding:10px 18px;border-radius:22px;font-weight:700;font-size:.9rem;z-index:99;animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translate(-50%,12px)}}
.pop{position:fixed;top:-40px;font-size:2rem;pointer-events:none;animation:jatuh 1.6s ease-in forwards;z-index:90}
@keyframes jatuh{to{transform:translateY(110vh) rotate(360deg)}}
.combo{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);font-family:"Baloo 2";font-size:2.4rem;font-weight:800;color:#F59E0B;pointer-events:none;z-index:50;text-shadow:0 3px 0 rgba(0,0,0,.2);animation:pc .9s ease-out forwards}
@keyframes pc{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}30%{transform:translate(-50%,-50%) scale(1.3);opacity:1}100%{transform:translate(-50%,-140%) scale(1);opacity:0}}
.empty{text-align:center;padding:30px 20px;color:var(--slate3)}
.empty .ic{font-size:3rem;display:block;margin-bottom:8px}
.tag-rose{background:var(--rose-l);color:var(--rose)!important}
.tag-emerald{background:var(--emerald-l);color:var(--emerald)!important}
.tag-amber{background:var(--amber-l);color:var(--amber)!important}
.tag-sky{background:var(--sky-l);color:var(--sky)!important}
.tag-violet{background:var(--violet-l);color:var(--violet)!important}
.lb{width:100%;border-collapse:collapse}
.lb td{padding:10px 6px;border-bottom:1px solid var(--line);font-weight:700}
.lb td:first-child{font-size:1.2rem}
.set-row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid var(--line);gap:12px}
.set-row .lbl{font-weight:700}
.set-row .lbl small{display:block;color:var(--slate3);font-weight:600;font-size:.76rem}
.toggle{width:50px;height:28px;background:var(--line);border-radius:28px;position:relative;flex-shrink:0;transition:background .2s}
.toggle.on{background:var(--emerald)}
.toggle i{position:absolute;top:2px;left:2px;width:24px;height:24px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on i{left:24px}
input[type=range]{flex:1;accent-color:var(--indigo)}
.back{display:flex;align-items:center;gap:8px;padding:6px 4px 14px;font-weight:700;color:var(--slate2)}
.back:active{transform:scale(.97)}
.sec-banner{padding:14px 16px;border-radius:14px;color:#fff;margin-bottom:12px}
.sec-banner.mtk{background:linear-gradient(135deg,#6366F1,#8B5CF6)}
.sec-banner.bind{background:linear-gradient(135deg,#F59E0B,#EF4444)}
.sec-banner.ipa{background:linear-gradient(135deg,#10B981,#06B6D4)}
.sec-banner.bing{background:linear-gradient(135deg,#EC4899,#8B5CF6)}
.sec-banner .ic{font-size:2.4rem;float:left;margin-right:12px}
.sec-banner .nm{font-family:"Baloo 2";font-weight:800;font-size:1.4rem}
.sec-banner .desc{font-size:.82rem;opacity:.92;font-weight:600;margin-top:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="bot" id="nav"></nav>
<script>
"use strict";

/* ===================== AUDIO ENGINE (musik procedural + SFX) ===================== */
const Snd={
  ctx:null,mGain:null,sGain:null,mTimer:null,mStep:0,mOn:false,vol:.55,sfxVol:.8,
  init(){
    if(this.ctx)return;
    try{this.ctx=new(window.AudioContext||window.webkitAudioContext)();
      this.mGain=this.ctx.createGain();this.mGain.gain.value=this.vol;this.mGain.connect(this.ctx.destination);
      this.sGain=this.ctx.createGain();this.sGain.gain.value=this.sfxVol;this.sGain.connect(this.ctx.destination);
    }catch(e){}
  },
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
  note(freq,dur,type='triangle',vol=.18,when=0,dest){
    if(!this.ctx)return;const t=this.ctx.currentTime+when;
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);
    g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(dest||this.sGain);o.start(t);o.stop(t+dur+.05);
  },
  noise(dur,vol=.2,filter='highpass',freq=1000){
    if(!this.ctx)return;const t=this.ctx.currentTime;
    const buf=this.ctx.createBuffer(1,Math.max(1,this.ctx.sampleRate*dur),this.ctx.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const s=this.ctx.createBufferSource();s.buffer=buf;
    const f=this.ctx.createBiquadFilter();f.type=filter;f.frequency.value=freq;
    const g=this.ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    s.connect(f);f.connect(g);g.connect(this.sGain);s.start(t);s.stop(t+dur);
  },
  scale:[262,294,330,392,440,523,587,659],
  melody:[0,2,4,5,7,5,4,2,0,2,4,5,4,2,4,7],
  bass:[131,131,165,165,196,196,165,131],
  startMusic(){
    this.init();this.resume();if(this.mOn)return;this.mOn=true;
    const beat=300;
    this.mStep=0;
    const tick=()=>{
      if(!this.mOn||!this.ctx)return;
      const s=this.mStep%16;
      const ni=this.melody[s];
      if(ni!=null)this.note(this.scale[ni],.3,'sine',.08,0,this.mGain);
      if(s%2===0){const b=this.bass[s/2%8];this.note(b,.45,'triangle',.07,0,this.mGain)}
      if(s%2===1)this.noise(.04,.025,'highpass',2200,this.mGain);
      this.mStep++;
    };
    tick();this.mTimer=setInterval(tick,beat);
  },
  stopMusic(){this.mOn=false;if(this.mTimer){clearInterval(this.mTimer);this.mTimer=null}},
  sfx(t){
    this.init();this.resume();if(!this.ctx)return;
    switch(t){
      case 'ok':[660,880,1100].forEach((f,i)=>this.note(f,.18,'triangle',.22,i*.07));break;
      case 'no':[400,300,220].forEach((f,i)=>this.note(f,.22,'sawtooth',.15,i*.10));break;
      case 'tap':this.note(880,.05,'square',.10);break;
      case 'click':this.note(440,.04,'square',.08);break;
      case 'pop':this.noise(.12,.22,'bandpass',800);this.note(1200,.08,'sine',.15);break;
      case 'win':[523,659,784,1047].forEach((f,i)=>this.note(f,.3,'triangle',.22,i*.10));break;
      case 'star':this.note(1568,.1,'sine',.16);this.note(2093,.14,'sine',.12,.08);break;
      case 'whoosh':this.noise(.22,.15,'lowpass',500);break;
      case 'coin':[988,1319].forEach((f,i)=>this.note(f,.1,'square',.16,i*.05));break;
      case 'combo':[659,784,988,1319].forEach((f,i)=>this.note(f,.08,'triangle',.2,i*.04));break;
      case 'level':[523,659,784,1047,1319].forEach((f,i)=>this.note(f,.18,'triangle',.2,i*.09));break;
      case 'lose':[523,440,349,262].forEach((f,i)=>this.note(f,.22,'sawtooth',.16,i*.11));break;
      case 'flip':this.note(700,.04,'square',.10);this.note(1050,.06,'square',.10,.04);break;
      case 'build':this.note(330,.08,'triangle',.15);this.note(440,.12,'triangle',.15,.06);break;
      case 'crash':this.noise(.4,.3,'lowpass',300);break;
    }
  },
  setVol(v){this.vol=v;if(this.mGain)this.mGain.gain.value=v},
  setSfxVol(v){this.sfxVol=v;if(this.sGain)this.sGain.gain.value=v},
  applyPrefs(){if(S&&S.audio&&S.audio.music)this.startMusic();else this.stopMusic()}
};

/* ===================== TEXT TO SPEECH ===================== */
let vReady=false,vId=null;
function loadV(){if(!window.speechSynthesis)return;const vs=speechSynthesis.getVoices();if(vs.length){vId=vs.find(v=>/^(id|ms)/i.test(v.lang.replace('_','-')))||vs[0];vReady=true}}
if(window.speechSynthesis){loadV();speechSynthesis.onvoiceschanged=loadV}
const lisan=t=>t.replace(/\+/g,' tambah ').replace(/[−-]/g,' kurang ').replace(/×/g,' kali ').replace(/÷/g,' dibagi ').replace(/=/g,' sama dengan ').replace(/\?/g,'').replace(/[🍎🍊🍓🍌]/g,'');
function say(t){if(!S||S.suara===false||!window.speechSynthesis)return;try{speechSynthesis.cancel();if(!vReady)loadV();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';if(vId)u.voice=vId;u.rate=.92;u.pitch=1.2;speechSynthesis.speak(u)}catch(e){}}

/* ===================== MISC HELPERS ===================== */
function beri(k){if(!S.badges.includes(k)){S.badges.push(k);simpan();setTimeout(()=>{hujan('🏅');say('Kamu mendapat lencana '+LENCANA[k][1])},600)}}
function hariIni(){
  const t=today();
  if(S.last!==t){
    const k=new Date(Date.now()-864e5).toISOString().slice(0,10);
    S.streak=S.last===k?S.streak+1:1;S.last=t;simpan();
    if(S.streak>=3)beri('rajin');
  }
}
function lvl(){return Math.floor(S.xp/200)+1}
function xpPct(){return Math.round((S.xp%200)/200*100)}

    {id:'hari',nama:'Hari (Days)',ikon:'📅',fase:3,gen:()=>{const db=[['Senin','Monday'],['Selasa','Tuesday'],['Rabu','Wednesday'],['Kamis','Thursday'],['Jumat','Friday'],['Sabtu','Saturday'],['Minggu','Sunday']];const w=db[rnd(0,db.length-1)];const o=db.filter(x=>x!==w).map(x=>x[1]).slice(0,3);o.push(w[1]);return{t:`Bahasa Inggris dari "${w[0]}":`,a:w[1],o:acak(o),tip:'Ingat nama hari'}}},

/* generate pilihan default kalau topik tak punya opsi */
function genSoal(subjek,topikId,L){
  const t=KURIKULUM[subjek].topik.find(x=>x.id===topikId);
  if(!t)return null;
  const q=t.gen(L||S.lv);
  if(!q.o&&q.a!=null){
    const s=new Set([q.a]);let g=0;
    while(s.size<4&&g++<60){const v=q.a+rnd(-5,5);if(v>=0&&v!==q.a&&typeof v==='number')s.add(v)}
    q.o=acak([...s]);
  }
  q.subjek=subjek;q.topik=topikId;q.fase=t.fase;q.namaTopik=t.nama;
  return q;
}

/* ===================== QUIZ ENGINE ===================== */
let Q=null,kunci=false,streak=0;
function bukaTopik(el){
  const k=el.dataset.k,t=el.dataset.t,lock=el.dataset.lock==='1';
  if(lock){toast('Selesaikan fase sebelumnya dulu');return}
  mulaiPel(k,t);
}
function mulaiPel(subjek,topikId){
  const t=KURIKULUM[subjek].topik.find(x=>x.id===topikId);
  // adaptive: gunakan level pemain
  Q={subjek,topikId,topikNama:t.nama,i:0,benar:0,t0:Date.now(),list:Array.from({length:10},()=>genSoal(subjek,topikId))};
  streak=0;
  Snd.sfx('whoosh');say('Ayo mulai pelajaran!');
  soal();
}
function soal(){
  kunci=false;
  const q=Q.list[Q.i];
  const s=KURIKULUM[Q.subjek];
  let body='';
  // tipe soal adaptif: 80% pilihan ganda, 20% isian untuk topik sederhana
  const tipe=q.tipe||(Math.random()<.2&&!q.vis?'isian':'pilihan');
  q.tipe=tipe;
  if(tipe==='pilihan'){
    body=`<div class="opts">${q.o.map(o=>`<button class="opt" onclick="jawab('${String(o).replace(/'/g,"\\'")}',this)">${o}</button>`).join('')}</div>`;
  }else if(tipe==='isian'){
    body=`<div class="isi-disp" id="isi-disp">·</div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="ketik('${n}')">${n}</button>`).join('')}<button onclick="ketik('0')">0</button><button onclick="ketik('⌫')">⌫</button><button onclick="ketik('✓')" style="background:var(--indigo);color:#fff">✓</button></div>`;
    q.inp='';
  }
  view(`<div class="back" onclick="if(confirm('Keluar dari pelajaran?'))home()">← Keluar</div>
  <div class="card">
    <div class="q-pel"><span>${s.ikon} ${s.nama}</span><span>Soal ${Q.i+1}/10</span></div>
    <div class="prog"><i style="width:${Q.i*10}%"></i></div>
    <div class="q-meta"><span class="q-tag ${s.tag}">${Q.topikNama}</span><span class="q-tag">${fase().split('·')[1]?.trim()||''}</span></div>
    <div class="q-text">${q.t}</div>
    ${q.vis?`<div class="q-vis">${q.vis}</div>`:''}
    ${body}
    <div class="row" style="margin-top:10px">
      <button class="ghost" onclick="Snd.resume();say(cur().t)">🔊 Bacakan</button>
      <button class="ghost" onclick="showTip()">💡 Petunjuk</button>
    </div>
    <div id="fb"></div>
  </div>`);
  say(q.t.replace(/\n/g,' '));
}
function cur(){return Q.list[Q.i]}
function showTip(){$('#fb').className='';$('#fb').textContent='💡 '+cur().tip;say(cur().tip)}
function ketik(n){
  if(kunci)return;
  if(n==='⌫')Q.list[Q.i].inp=(Q.list[Q.i].inp||'').slice(0,-1);
  else if(n==='✓'){cekIsian();return}
  else if((Q.list[Q.i].inp||'').length<5)Q.list[Q.i].inp=(Q.list[Q.i].inp||'')+n;
  Snd.sfx('tap');
  $('#isi-disp').textContent=Q.list[Q.i].inp||'·';
}
function cekIsian(){if(kunci)return;const v=Q.list[Q.i].inp;jawab(v,null)}
function jawab(v,el){
  if(kunci)return;kunci=true;
  const q=cur();const ok=String(v).trim()===String(q.a).trim();
  // catat statistik
  if(!S.stats.subjek[Q.subjek])S.stats.subjek[Q.subjek]={b:0,s:0};
  S.stats.subjek[Q.subjek][ok?'b':'s']++;
  if(!S.stats.subjek[Q.subjek].topik)S.stats.subjek[Q.subjek].topik={};
  if(!S.stats.subjek[Q.subjek].topik[Q.topikId])S.stats.subjek[Q.subjek].topik[Q.topikId]={b:0,s:0};
  S.stats.subjek[Q.subjek].topik[Q.topikId][ok?'b':'s']++;
  S.stats[ok?'benar':'salah']++;
  if(ok){
    Q.benar++;streak++;S.today.benar=(S.today.benar||0)+1;
    Snd.sfx('ok');hujan('⭐',6);
    if(streak>=3){Snd.sfx('combo');comboPop(streak)}
    if(streak>=5)beri('lurus');
    const p=PUJI[rnd(0,PUJI.length-1)];
    $('#fb').className='ok';$('#fb').textContent='🎉 '+p;say(p);
    if(el)el.classList.add('ok');
    // lencana subjek
    if(Q.subjek==='mtk'&&S.stats.subjek.mtk.b>=10)beri('mtk');
    if(Q.subjek==='bind'&&S.stats.subjek.bind.b>=8)beri('bind');
    if(Q.subjek==='ipa'&&S.stats.subjek.ipa.b>=8)beri('ipa');
    if(Q.subjek==='bing'&&S.stats.subjek.bing.b>=8)beri('bing');
  }else{
    streak=0;Snd.sfx('no');
    S.salahBank.push({subjek:Q.subjek,topikId:Q.topikId,a:q.a,t:q.t,ts:Date.now()});
    if(S.salahBank.length>50)S.salahBank.shift();
    const sm=SEMANGAT[rnd(0,SEMANGAT.length-1)];
    $('#fb').className='no';$('#fb').textContent='💪 '+sm+' Jawaban: '+q.a;say(sm+' Jawabannya '+q.a);
    if(el)el.classList.add('no');
  }
  if(q.tipe==='pilihan')document.querySelectorAll('.opt').forEach(b=>{if(b.textContent===String(q.a))b.classList.add('ok')});
  setTimeout(()=>{Q.i++;Q.i>=10?selesaiPel():soal()},1900);
}
function selesaiPel(){
  const b=Q.benar,xp=b*15+(b>=8?30:0)+(b===10?20:0);const bin=b>=9?3:b>=7?2:b>=4?1:0;
  let msg='';
  S.xp+=xp;S.today.xp=(S.today.xp||0)+xp;S.today.pel=(S.today.pel||0)+1;beri('pertama');
  if(b===10)beri('perfek');
  if(b>=8&&S.lv<3){S.lv++;msg='Naik ke level berikutnya! 🚀'}else if(b<=3&&S.lv>1){S.lv--;msg='Kita ulang yang lebih mudah ya 🌱'}else{msg=b>=8?'Kerja bagus, teruskan! 💪':'Terus berlatih ya 💪'}
  // catat riwayat harian
  S.riwayat.push({date:today(),subjek:Q.subjek,benar:b,total:10,xp,durasi:Math.round((Date.now()-Q.t0)/1000)});
  if(S.riwayat.length>200)S.riwayat.shift();
  simpan();sync('riwayat',{subjek:Q.subjek,topik:Q.topikId,benar:b,total:10,skor:xp});
  Snd.sfx(b>=8?'win':'star');hujan(bin?'🌟':'🎈',18);
  const k=b===10?'Sempurna!':b>=8?'Luar biasa':b>=5?'Bagus sekali':'Terus berlatih';
  say(`${k} ${S.nama}! Kamu benar ${b} dari 10.${msg.includes('Naik')?' '+msg:''}`);
  view(`<div class="card" style="text-align:center;padding:24px">
    <div style="font-size:3.6rem;margin-bottom:8px">${b===10?'🏆':b>=8?'🌟':b>=5?'😄':'🤗'}</div>

    <div style="margin:18px 0"><div style="font-family:'Baloo 2';font-size:3rem;font-weight:800;color:var(--indigo)">${b}/10</div><div class="sub">+${xp} poin ${b===10?'· Bonus Sempurna! 🌟':''}</div></div>
    <h2 style="font-size:2.4rem;margin:10px 0">${'⭐'.repeat(bin)||'💪'}</h2>
    <p class="sub" style="margin-bottom:14px">${msg}</p>
    <div class="row">
      <button class="btn sec" onclick="beranda()">🏠 Beranda</button>
      <button class="btn" onclick="mulaiPel('${Q.subjek}','${Q.topikId}')">🔁 Lagi</button>

function game_kartu(){
  stopAllGames();
  const L=S.lv;
  const qs=[],pakai=new Set();
  while(qs.length<6){
    const tops=KURIKULUM.mtk.topik.filter(t=>t.fase<=L);
    const tp=tops[rnd(0,tops.length-1)];
    const q=tp.gen(L);
    if(!pakai.has(q.a)){pakai.add(q.a);qs.push(q)}
  }
  const kt=acak(qs.flatMap((q,i)=>[{p:i,s:q.t.replace(/\n/g,' ').replace(' = ?','').replace('?','')},{p:i,s:String(q.a)}]));
  let buka=[],cocok=0,langkah=0,tahan=false;
  view(`<div class="back" onclick="home()">← Keluar</div>
  <div class="card"><p class="sub" style="text-align:center;margin-bottom:10px">Cocokkan soal dengan jawabannya!</p>
  <div class="hud"><span class="pill" id="pl">Langkah: 0</span><span class="pill" id="pc">Cocok: 0/6</span></div>
  <div class="grid" style="grid-template-columns:repeat(3,1fr)">${kt.map((k,i)=>`<button class="kartu" id="k${i}" style="height:80px;border:2px solid var(--line);background:var(--card);color:var(--slate);border-radius:14px;font-family:'Baloo 2';font-weight:800;font-size:1.1rem;box-shadow:0 3px 0 var(--line)">❓</button>`).join('')}</div></div>`);
  say('Cocokkan soal dengan jawabannya!');
  kt.forEach((k,i)=>{
    const el=document.querySelector('#k'+i);
    if(!el)return;
    el.onclick=()=>{
      if(tahan||el.classList.contains('buka')||el.classList.contains('cocok'))return;
      el.textContent=k.s;el.classList.add('buka');Snd.sfx('flip');buka.push(i);
      if(buka.length===2){
        langkah++;$('#pl').textContent='Langkah: '+langkah;
        const[a,b]=buka;
        if(kt[a].p===kt[b].p){
          ['#k'+a,'#k'+b].forEach(s=>{const e=$(s);e.classList.replace('buka','cocok');e.style.background='var(--emerald)';e.style.color='#fff'});
          Snd.sfx('ok');buka=[];cocok++;$('#pc').textContent='Cocok: '+cocok+'/6';
          say(kt[a].s.length>3?lisan(kt[a].s)+' sama dengan '+qs[kt[a].p].a:'Cocok!');
          if(cocok===6){
            const xp=Math.max(15,70-langkah*3);S.xp+=xp;S.today.xp=(S.today.xp||0)+xp;S.today.game=(S.today.game||0)+1;
            let rek='';if(xp>(S.rekor.kartu||0)){S.rekor.kartu=xp;rek='Rekor baru! 🏆'}
            simpan();Snd.sfx('win');hujan('🌟',18);say(`Hebat! Semua cocok! ${rek}`);
            setTimeout(()=>view(`<div class="card" style="text-align:center;padding:24px">
              <div style="font-size:3.6rem;margin-bottom:8px">🃏</div>
              <h1 style="font-size:1.6rem;color:var(--indigo)">Semua Cocok!</h1>
              <p class="sub" style="margin-top:4px">${langkah} langkah · +${xp} poin</p>
              <p style="margin-top:8px;color:var(--amber);font-weight:800">${rek}</p>
              <div class="row" style="margin-top:18px"><button class="btn sec" onclick="beranda()">🏠 Beranda</button><button class="btn" onclick="game_kartu()">🔁 Lagi</button></div>
            </div>`),1200);
          }
        }else{
          tahan=true;Snd.sfx('no');
          setTimeout(()=>{[a,b].forEach(n=>{const e=$('#k'+n);e.classList.remove('buka');e.textContent='❓'});buka=[];tahan=false},800);
        }
      }
    };
  });
}

  if(b>=6)beri('kata');
  simpan();Snd.sfx(b>=6?'win':'lose');hujan('🔤',18);say(`Hebat! Kamu benar ${b} dari ${W.list.length}.`);
  view(`<div class="card" style="text-align:center;padding:24px">
    <div style="font-size:3.6rem;margin-bottom:8px">🔤</div>
    <h1 style="font-size:1.6rem;color:var(--indigo)">Benar ${b}/${W.list.length}!</h1>
    <p class="sub" style="margin-top:4px">+${xp} poin · Rekor: ${S.rekor.kata||0}</p>
    <p style="margin-top:8px;color:var(--amber);font-weight:800">${rek}</p>
    <div class="row" style="margin-top:18px"><button class="btn sec" onclick="beranda()">🏠 Beranda</button><button class="btn" onclick="game_kata()">🔁 Lagi</button></div>
  </div>`);
  W.hidup=false;
}

/* ===================== GAME BARU: LAB SAINS ===================== */
function game_lab(){
  stopAllGames();
  const DB=[
    {pair:['H₂O','Air'],ic:'💧'},
    {pair:['O₂','Oksigen'],ic:'🫁'},
    {pair:['CO₂','Karbondioksida'],ic:'🌫️'},
    {pair:['NaCl','Garam Dapur'],ic:'🧂'},
    {pair:['C₆H₁₂O₆','Gula'],ic:'🍬'},
    {pair:['H₂','Hidrogen'],ic:'🎈'},
    {pair:['N₂','Nitrogen'],ic:'💨'},
    {pair:['Fe','Besi'],ic:'⚙️'},
  ];
  const pairs=acak(DB).slice(0,5);
  const cards=acak(pairs.flatMap((p,i)=>[{p:i,s:p.pair[0],ic:p.ic,left:true},{p:i,s:p.pair[1],left:false}]));
  let first=null,lock=false,cocok=0,langkah=0;
  view(`<div class="back" onclick="home()">← Keluar</div>
  <div class="card">
    <p class="sub" style="text-align:center;margin-bottom:10px">Cocokkan rumus kimia dengan namanya!</p>
    <div class="hud"><span class="pill" id="ll">Langkah: 0</span><span class="pill" id="lc">Cocok: 0/${pairs.length}</span></div>
    <div class="cocok" id="lc-grid">${cards.map((c,i)=>`<button class="lab-card" data-i="${i}" data-p="${c.p}" data-left="${c.left?1:0}" onclick="labKlik(${i})" style="padding:14px 6px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-weight:800;font-family:'Baloo 2';font-size:1rem;min-height:60px">${c.left?'⚗️':'📖'}<br>${c.s}</button>`).join('')}</div>
    <div id="lf" style="min-height:30px;text-align:center;font-weight:800;margin-top:10px"></div>
  </div>`);
  say('Cocokkan rumus dengan namanya!');
  window._lab={cards,cocok,langkah};
}
function labKlik(i){
  if(!window._lab||window._lab.lock)return;
  const L=window._lab;const el=document.querySelector(`.lab-card[data-i="${i}"]`);
  if(!el||el.classList.contains('cocok')||el.classList.contains('sel'))return;
  el.classList.add('sel');Snd.sfx('flip');
  if(!L.first){L.first=i;return}
  if(L.first===i)return;
  L.langkah++;$('#ll').textContent='Langkah: '+L.langkah;
  const a=L.cards[L.first],b=L.cards[i];
  if(a.p===b.p&&a.left!==b.left){
    // match
    [L.first,i].forEach(j=>{const e=document.querySelector(`.lab-card[data-i="${j}"]`);e.classList.remove('sel');e.classList.add('cocok');e.style.background='var(--emerald)';e.style.color='#fff';e.style.borderColor='var(--emerald)'});
    Snd.sfx('ok');L.cocok++;$('#lc').textContent='Cocok: '+L.cocok+'/'+L.cards.length/2;
    say(a.s+' sama dengan '+b.s);
    L.first=null;
    if(L.cocok===L.cards.length/2){
      const xp=Math.max(20,80-L.langkah*4);S.xp+=xp;S.today.xp=(S.today.xp||0)+xp;S.today.game=(S.today.game||0)+1;
      let rek='';if(xp>(S.rekor.lab||0)){S.rekor.lab=xp;rek='Rekor baru! 🏆'}
      beri('lab');simpan();Snd.sfx('win');hujan('⚗️',18);say(`Hebat! Semua cocok! ${rek}`);
      setTimeout(()=>view(`<div class="card" style="text-align:center;padding:24px">
        <div style="font-size:3.6rem;margin-bottom:8px">⚗️</div>
        <h1 style="font-size:1.6rem;color:var(--indigo)">Lab Selesai!</h1>
        <p class="sub" style="margin-top:4px">${L.langkah} langkah · +${xp} poin</p>
        <p style="margin-top:8px;color:var(--amber);font-weight:800">${rek}</p>
        <div class="row" style="margin-top:18px"><button class="btn sec" onclick="beranda()">🏠 Beranda</button><button class="btn" onclick="game_lab()">🔁 Lagi</button></div>
      </div>`),1000);
    }
  }else{
    L.lock=true;Snd.sfx('no');
    setTimeout(()=>{[L.first,i].forEach(j=>{const e=document.querySelector(`.lab-card[data-i="${j}"]`);if(e)e.classList.remove('sel')});L.first=null;L.lock=false},800);
  }
}

/* ===================== STOP ALL GAMES ===================== */
function stopAllGames(){stopGame();stopKilat();stopMenara();stopKata();if(window._lab)window._lab=null}
function home(){stopAllGames();beranda()}

/* ===================== PROFIL & PENGATURAN ===================== */
function profil(){
  renderNav('profil');
  const l=lvl(),xp=xpPct();
  const totBenar=S.stats.benar||0,totSalah=S.stats.salah||0;
  const akurasi=totBenar+totSalah>0?Math.round(totBenar/(totBenar+totSalah)*100):0;
  view(`<div class="back" onclick="beranda()">← Kembali</div>
  <div class="card" style="text-align:center;padding:20px">
    <div style="font-size:4rem">${S.av}</div>
    <h1 style="font-size:1.5rem;color:var(--indigo);margin-top:6px">${S.nama}</h1>
    <p class="sub">Level ${l} · ${fase()}</p>
    <div class="xpbar" style="height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:14px"><i style="display:block;height:100%;width:${xp}%;background:linear-gradient(90deg,var(--indigo),var(--violet))"></i></div>
    <p class="sub" style="margin-top:6px">${S.xp%200}/200 poin ke Level ${l+1}</p>
  </div>

  <div class="card">
    <h2>📊 Statistik Belajar</h2>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div style="background:var(--indigo-l);padding:12px;border-radius:12px;text-align:center"><div style="font-family:'Baloo 2';font-size:1.6rem;font-weight:800;color:var(--indigo)">${totBenar}</div><div class="sub">Benar</div></div>
      <div style="background:var(--rose-l);padding:12px;border-radius:12px;text-align:center"><div style="font-family:'Baloo 2';font-size:1.6rem;font-weight:800;color:var(--rose)">${totSalah}</div><div class="sub">Salah</div></div>
      <div style="background:var(--emerald-l);padding:12px;border-radius:12px;text-align:center"><div style="font-family:'Baloo 2';font-size:1.6rem;font-weight:800;color:var(--emerald)">${akurasi}%</div><div class="sub">Akurasi</div></div>
      <div style="background:var(--amber-l);padding:12px;border-radius:12px;text-align:center"><div style="font-family:'Baloo 2';font-size:1.6rem;font-weight:800;color:var(--amber)">${S.streak}🔥</div><div class="sub">Hari Beruntun</div></div>
    </div>
  </div>

  <div class="card">
    <h2>📚 Per Subjek</h2>
    ${Object.entries(KURIKULUM).map(([k,s])=>{
      const st=S.stats.subjek[k]||{b:0,s:0};const tot=st.b+st.s;const pct=tot?Math.round(st.b/tot*100):0;
      return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-weight:700;font-size:.88rem"><span>${s.ikon} ${s.nama}</span><span class="sub">${st.b}/${tot}</span></div><div class="prog" style="margin:4px 0 0"><i style="width:${pct}%;background:${s.warna}"></i></div></div>`;
    }).join('')}
  </div>

  <div class="card">
    <h2>🏅 Lencanaku (${S.badges.length}/${Object.keys(LENCANA).length})</h2>
    <div class="bdg-grid">${Object.entries(LENCANA).map(([k,v])=>`<div class="bdg ${S.badges.includes(k)?'':'off'}"><span class="ic">${v[0]}</span>${v[1]}<br><small style="color:var(--slate3)">${v[2]}</small></div>`).join('')}</div>
  </div>

  <div class="card">
    <h2>🏆 Rekor Game</h2>
    ${[['menara','🏰','Menara Pintar'],['balon','🎈','Balon Ajaib'],['kartu','🃏','Kartu Pasangan'],['kilat','⚡','Berhitung Kilat'],['kata','🔤','Petualangan Kata'],['lab','⚗️','Lab Sains']].map(([k,i,n])=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span style="font-weight:700">${i} ${n}</span><span style="font-family:'Baloo 2';font-weight:800;color:var(--indigo)">${S.rekor[k]||0}</span></div>`).join('')}
  </div>

  <button class="btn sec" onclick="pengaturan()">⚙️ Pengaturan</button>
  <button class="btn warna" style="margin-top:8px" onclick="ganti()">🚪 Ganti Pemain</button>
  `);
}
function pengaturan(){
  view(`<div class="back" onclick="${S?'profil()':'masuk()'}">← Kembali</div>
  <div class="card">
    <h2>⚙️ Pengaturan</h2>
    <div class="set-row"><div class="lbl">🎶 Musik Latar<small>Melodi ceria procedural</small></div><div class="toggle ${S.audio.music?'on':''}" onclick="toggleMusik()"><i></i></div></div>
    <div class="set-row"><span class="lbl">🎵 Volume Musik</span><input type="range" min="0" max="100" value="${Math.round((S.audio.vol||.55)*100)}" oninput="setVolM(this.value)"></div>
    <div class="set-row"><span class="lbl">🔊 Volume Efek</span><input type="range" min="0" max="100" value="${Math.round((S.audio.sfxVol||.8)*100)}" oninput="setVolS(this.value)"></div>
    <div class="set-row"><div class="lbl">🗣️ Suara Bicara<small>Bacakan soal & petunjuk</small></div><div class="toggle ${S.suara!==false?'on':''}" onclick="toggleSuara()"><i></i></div></div>
  </div>
  <button class="btn sec" onclick="profil()">✅ Selesai</button>
  <button class="btn warna" style="margin-top:8px" onclick="if(confirm('Hapus semua data dan mulai dari awal?')){localStorage.removeItem('akademia');location.reload()}">🗑️ Reset Data</button>
  `);
}
function toggleMusik(){
  S.audio.music=!S.audio.music;simpan();Snd.applyPrefs();
  toast(S.audio.music?'🎶 Musik dinyalakan':'🔇 Musik dimatikan');
  pengaturan();
}
function setVolM(v){S.audio.vol=v/100;simpan();Snd.setVol(v/100)}
function setVolS(v){S.audio.sfxVol=v/100;simpan();Snd.setSfxVol(v/100);if(v>0)Snd.sfx('tap')}
function toggleSuara(){S.suara=S.suara===false;simpan();if(S.suara){Snd.resume();say('Suara dinyalakan')}pengaturan()}
function ganti(){if(confirm('Ganti pemain? Data di perangkat ini akan dihapus.')){Snd.stopMusic();localStorage.removeItem('akademia');S=null;masuk()}}

/* ===================== START ===================== */
S?beranda():masuk();
</script>
</body>
</html>
